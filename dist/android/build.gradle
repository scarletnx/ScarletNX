// The Android app around what CMake installs into the stage folder: the libraries, SDL's Java and the icon
// (scripts/android-apk.sh, docs/ANDROID.md)
plugins {
    id 'com.android.application' version '9.4.0'
}

def stage = file(providers.gradleProperty('scarletnx.stage').get())
layout.buildDirectory = new File(stage, 'gradle')
// One key signs every APK given it, so each installs over the one before: scarletnx.keystore names its keystore,
// SNX_ANDROID_KEYSTORE_PASSWORD is the keystore's password and the key's, SNX_ANDROID_KEY_ALIAS the key (scarletnx).
// Without it the machine's own debug key signs, a new one on every machine that had none (docs/ANDROID.md)
def keystore = providers.gradleProperty('scarletnx.keystore').orNull

android {
    namespace = 'org.scarletnx'
    compileSdk = 36
    defaultConfig {
        applicationId = 'org.scarletnx'
        minSdk = 21 // the native builds' API level too (scripts/android-*.sh)
        targetSdk = 36
        versionCode = 1
        versionName = '0.1'
    }
    if (keystore) {
        signingConfigs.debug {
            storeFile = file(keystore)
            storePassword = providers.environmentVariable('SNX_ANDROID_KEYSTORE_PASSWORD').get()
            keyAlias = providers.environmentVariable('SNX_ANDROID_KEY_ALIAS').orElse('scarletnx').get()
            keyPassword = storePassword
        }
    }
    sourceSets.main {
        java.srcDir new File(stage, 'java')
        jniLibs.srcDir new File(stage, 'lib')
        res.srcDir new File(stage, 'res')
    }
    // extracted into the app's libraries folder, where the menu runs the driver from
    packaging.jniLibs.useLegacyPackaging = true
    // Robolectric's tests read the merged manifest (the provider's declaration) and resources
    testOptions.unitTests.includeAndroidResources = true
}

// The unit tests (src/test, docs/ANDROID.md): JUnit on the JVM, Robolectric where a test needs Android's own classes
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

// JniContractTest reads the C code that calls the app's Java and that its native methods call. Each test is named in
// the log, and a failure with its whole message
tasks.withType(Test).configureEach {
    def source = file('../../src')
    systemProperty 'scarletnx.source', source.path
    inputs.files(fileTree(source) { include '**/*.c' }).withPathSensitivity(PathSensitivity.RELATIVE)
    // Robolectric's Android 16 (the targetSdk) reads and sets a file descriptor's number through the JDK's internals
    jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// AGP 9 adds Kotlin's standard library (2.4 MB of dex) to every app; this one is Java only
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
}
