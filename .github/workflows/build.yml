name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # a version's release (publish.yml)
  pull_request:
    # a draft builds and tests as much as a pull request ready for review, so leaving draft starts nothing
    types: [opened, synchronize, reopened]
    # skipped when the change is only in files that no build or test reads. tracked_material.py reads them all and runs
    # on its own (pr-checks.yml). docs/user/deprecations.md, docs/user/gui.md and docs/layers/cpu/plan.md are test
    # inputs (tests/setup.c, tests/gui_theme.c, tests/cpu_plan_tools.py), so a change to one of them still builds
    paths:
      - '**'
      - '!**/*.md'
      - '!.claude/**'
      - '!.gitignore'
      - '!.github/ISSUE_TEMPLATE/**'
      - 'docs/layers/cpu/plan.md'
      - 'docs/user/deprecations.md'
      - 'docs/user/gui.md'
  workflow_dispatch:
  # main every three hours, so a nightly comes out while merges cancel main's pushes' runs; a run whose commit already
  # has its nightly cancels itself (nightly-due)
  schedule:
    - cron: '23 */3 * * *'

# Jobs only read the repository, and a failed job has the rest of its run cancelled (scripts/fail-fast.py). A
# push to main, a scheduled run or a run of main by hand that builds everywhere becomes a nightly, and a pull request's
# run a prerelease, in scarletnx/nightly: publish.yml does it once this workflow ends
permissions:
  contents: read
  actions: write

# a push to a pull request cancels that pull request's build still running, and a push to main main's: only the newest
# commit is built, and publish.yml publishes the newest that built everywhere. A tag and a run by hand build every time
concurrency:
  group: >-
    build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}

# The Linux x86-64 and AArch64 tests' options, the appimage job's: SNX_TEST_OPTIONS go on the default tree,
# SNX_HEADLESS_OPTIONS make the headless Vulkan tree
env:
  SNX_TEST_OPTIONS: -DSNX_TEST_VP9_VECTORS=ON -DSNX_TEST_ARM_DIFF=ON -DSNX_TEST_LLVM_SWEEP=ON
  SNX_HEADLESS_OPTIONS: -DSNX_BUILD_GUI=OFF -DSNX_DEPLOY=OFF -DSNX_TEST_VULKAN=ON -DSNX_TEST_AV1_VECTORS=ON
  # the jobs that may fail without failing the run (continue-on-error), whose failure cancels nothing
  # (scripts/fail-fast.py; tests/fail_fast_test.py holds the two to each other)
  SNX_OPTIONAL_JOBS: '^(macOS and iOS \(arm64\)|Windows \(Clang \+ LLVM, aarch64\)|Linux AppImage \((ppc64le|ppc64|riscv64|loongarch64)\))$'

# Linux jobs run in Arch Linux, which has the same Clang 23 and clang-format 23 as development, and its LLVM 23 for the
# recompiler's code generator (required, cmake/llvm.cmake). Windows uses MSYS2 CLANG64 (CLANGARM64 on Arm) so Clang, the
# MinGW/UCRT runtime and LLVM's development libraries come from one compatible toolchain. FFmpeg, OpenSSL, Vulkan, SDL3
# and SPIRV-Tools' spirv-opt and spirv-val (cmake/spirv_tools.cmake) are built from the sources cpmfile.json pins, with
# MSYS2 providing the shell, GNU make and NASM needed by FFmpeg and the Perl OpenSSL's Configure runs on. Downloads are
# cached in .cache/cpm: one cache for the jobs that fetch the same sources (a Linux architecture's, the four cross
# builds, a Windows architecture's, Apple, Android), named by the hash of cpmfile.json and of the patches (a patched
# package's folder is named by its patches), with the name before the hash as a restore key, so a bump downloads only
# the packages it changed. Compiles go through ccache, whose .cache/ccache each compiling job restores from the newest
# one a push saved; a push saves it again, trimmed to what the run used, and a pull request's run saves none: it reads
# main's (the appimage job says why). The artifacts are what `cmake --install` puts in place: the binaries with the
# licenses that go with them.
jobs:
  # A scheduled run of a commit that has its nightly already: the run cancels itself, this job with it, which fails
  # nothing
  nightly-due:
    name: Nightly due
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Cancel the run when this commit has its nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/scarletnx/nightly/releases/latest" | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
          echo "the newest nightly: $latest; this run: ${GITHUB_SHA::7}"
          case $latest in
          *-"${GITHUB_SHA::7}")
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" ;;
          esac
  # Each Linux architecture's one job, on every event: the runtime installed into /usr and the AppImage made of it, then
  # the same tree with its tests on (ninja builds only what they change) and the headless Vulkan tree, each in its own
  # folder where its flags differ, all through one compiler cache; their tests; on a push the AppImage run as installed;
  # and on x86-64 Amberlith's probes on the AppImage's runtime. pkgforge's Arch image and tools
  # (https://github.com/pkgforge-dev/Anylinux-AppImages), see scripts/make-appimage.sh
  appimage:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-26.04' }}
    # LLVM's build (scripts/linux-llvm.sh) adds about half an hour where its cache misses
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container: ghcr.io/pkgforge-dev/archlinux:latest
    # Amberlith's probes (edenprobe before 1.0.0; docs/dev/edenprobe.md), on x86-64. The NRO of a release of
    # scarletnx/amberlith, pinned by its sha256, recompiled by the install and run on lavapipe: a case of
    # tests/edenprobe/linux-x86_64.txt, the ones that passed before, that no longer passes fails the job. The install's
    # scarletnx-android runs the probe's APK, pinned apart, against tests/edenprobe/android-x86_64.txt the same way.
    # Another release or other mode words want its file written again
    env:
      # the release's tag and its NRO's name, which carries the version
      EDENPROBE_VERSION: v1.0.4
      EDENPROBE_NRO: amberlith-1.0.4.nro
      EDENPROBE_SHA256: 3271c4af392cd21e842e1ea89b370eb376da154f039dbe9e7f5c5a2193a2bed0
      # every family that needs no person or network: headless, the audio family's sound is never played. Not graphics:
      # its suites write their own GPU command buffers, left out while the runtime had no Maxwell front end, and not
      # added back since it returned (docs/dev/edenprobe.md). hooks: the runtime answers nn::fs, time, pl, ngc and nsd
      # in the SDK's own functions and serves none of their services, so the probe asks through the functions it exports
      EDENPROBE_MODE: quick notime cpu fs video display kernel audio hooks
      # the APK (the probe's Android build) of a release of its own: its words run every family it has
      EDENPROBE_APK_VERSION: v1.0.0
      EDENPROBE_APK: amberlith-1.0.0.apk
      EDENPROBE_APK_SHA256: 192cc7750bac972d0f4d850eea7bbada7a84b3c5b6b24d25d4d8ba7f7b6933d8
      EDENPROBE_APK_MODE: quick
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # pacman's packages, which it takes before its mirrors: this week's cache, else last week's
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-appimage-${{ matrix.arch }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-appimage-${{ matrix.arch }}-
      # Before the checkout: without git, actions/checkout downloads the files without the history, and the AppImage's
      # version (git describe) is unknown. Mirrors drop a connection now and then (pkgforge's for aarch64 most), so each
      # pacman install is tried 3 times, 5 s apart. -Syuu, not -Syu: an image can be built ahead of its repo (pkgforge's
      # of 2026-11-12 had openssl 4 against Arch Linux ARM's 3.6.5, so Python lost ssl and pacman refused openssl), and
      # the second u takes every package to the repo's version; the tools below then install from the repo
      - name: Install git
        run: |
          for try in 1 2 3; do
            pacman -Syuu --noconfirm --needed git && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # the whole history, for git describe; the pull request's merge commit has the base it is diffed against below
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Each architecture's sources: x86-64 fetches glslang-tools, and AArch64 uses the system's glslangValidator
      # (cmake/glsl.cmake), so the two sets differ. qemu-reference restores x86-64's; a bump restores the cache before
      # it, which downloads only the packages that changed
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-linux-${{ matrix.arch }}-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-linux-${{ matrix.arch }}-
      # ccache under every compile, FFmpeg's, OpenSSL's and SPIRV-Tools' too, of every tree this job builds: from the
      # newest cache of this job on this branch, else on main, as a pull request has none of its own (saved below). Each
      # cmake gets it as its launcher: from the environment CMake would run its configure checks through it, and they
      # only miss
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      # FFmpeg's, OpenSSL's and SPIRV-Tools' builds (cmake/deps_cache.cmake), from the newest cache of this job on this
      # branch, else on main. The key named here is never saved: a run saves its own below, named after the builds it
      # used
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            # paths in the keys relative to the checkout, and no build folder in them: build trees share entries
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # The action pins its own setup script only: the tools that script downloads are pinned here to a commit of
      # Anylinux-AppImages, and checked against their SHA-256 below
      - name: Install the packaging tools
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/make-aur-package.sh
      - name: Check the packaging tools
        run: |
          sha256sum -c <<'EOF'
          0aea2f589658e5db1659a6ccb8d29546c4e03028f1e29b37c6450cece917249a  /usr/local/bin/quick-sharun
          d215f7676785f1a1bb8784e69085d66c1df81488ef31f1ba7198325a5be05130  /usr/local/bin/get-debloated-pkgs
          86afbf5045b78020c93fcd35bf0f642765a8dc339bb2dce534a0461ce3d3508d  /usr/local/bin/make-aur-package
          EOF
      # llvm: Clang's own, the opt of the LLVM settings, and llvm-config and LLVM-C for the tree that links Arch's LLVM
      # (the SDL3 fallback); the runtime links LLVM's libraries statically (below). jdk21-openjdk:
      # javac and jni.h, which the Android app driver (src/android) builds with, and the JVM scarletnx-android loads for
      # Amberlith's APK. meson: dav1d's build (cmake/dav1d.cmake), FFmpeg's AV1 decoder; without it AV1 movies play
      # black.
      # get-debloated-pkgs reads its release from api.github.com: unauthenticated, a runner's shared address gets
      # GitHub's 60 requests an hour and the script's 403, so it takes the job's token for those requests. Pinning its
      # release would still read api.github.com, and its own wait on a 403 ends after 5 tries
      - name: Install the build tools and the debloated Mesa
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # poppler: pdftotext, which the x86-64 back end's instruction selection is derived with (cmake/sdm.cmake);
          # without it the configure stops
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja meson make patch nasm perl python clang llvm sdl3 libx11 mesa vulkan-icd-loader ccache glslang jdk21-openjdk poppler && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          get-debloated-pkgs mesa-nano opus-mini icu-mini
      # it cancels the run once another of its jobs has failed (scripts/fail-fast.py), so the run stops at once
      - &fail-fast-watch
        name: Cancel the run when another job fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fail-fast.py start
      # Saved once a week, by its first run: what it installed, without the versions nothing installs any more. The
      # other runs of the week download only what changed since
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      # Which of Amberlith's runs this run calls for, before anything is built, so a pull request that calls for none
      # says so even when the job fails before the runs: the paths each loads are scripts/edenprobe.py's (runs), which
      # edenprobe_script tests. A push, a tag, the nightly's schedule and a run by hand run both, and Amberlith's main
      # beside the release; a pull request runs each only when it changes what that run loads, never the main's
      - name: Look for what each of Amberlith's runs loads
        id: runs
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'nro=true\napk=true\nmain=true\nany=true\n' >> "$GITHUB_OUTPUT"
            echo "a $GITHUB_EVENT_NAME runs the NRO and the APK, and Amberlith's main beside the release"
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changed=$(git diff --name-only HEAD^1 HEAD)
          said=$(python3 scripts/edenprobe.py runs <<<"$changed")
          printf '%s\nmain=false\n' "$said" >> "$GITHUB_OUTPUT"
          if [ "$said" = $'nro=false\napk=false' ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            count=0
            [ -z "$changed" ] || count=$(wc -l <<<"$changed")
            why="none of the $count files changed is one the NRO or the APK loads"
            echo "::notice title=edenprobe::Amberlith: not run, $why"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      # Whether the native back ends of the other machines are tested under Unicorn (ctest -L unicorn), which takes long:
      # a push, a tag, the nightly's schedule and a run by hand test them, a pull request only where it changes what they
      # test, by the script that says so in recompiler-changes too. Not that job's output: this job would wait for it
      - name: Look for what the tests under Unicorn test
        id: unicorn
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "unicorn=true" >> "$GITHUB_OUTPUT"
            echo "a $GITHUB_EVENT_NAME runs them"
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changed=$(git diff --name-only HEAD^1 HEAD)
          python3 scripts/recompiler-changes.py <<<"$changed" >> "$GITHUB_OUTPUT"
      # LLVM's libraries linked into the runtime, with the host's code generator alone (scripts/linux-llvm.sh), where
      # Arch's libLLVM is one library with every target. Built once for each version, the image's LLVM's,
      # whose opt prints the pipelines of the LLVM settings (cmake/settings.cmake)
      - name: Name the LLVM version
        id: llvm
        run: echo "version=$(llvm-config --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: llvm-cache
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: linux-llvm-${{ matrix.arch }}-${{ hashFiles('scripts/linux-llvm.sh', 'scripts/llvm-libraries/CMakeLists.txt', 'cmake/llvm_components.cmake') }}-${{ steps.llvm.outputs.version }}
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          LLVM_VERSION: ${{ steps.llvm.outputs.version }}
        run: scripts/linux-llvm.sh ${{ matrix.arch }} "$PWD/.cache/llvm/${{ matrix.arch }}"
      # Saved as soon as it is built, as the apple job saves its own
      - if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      # A release leaves out scarletnx --mcp's A64 disassembler (SNX_A64_DISASM), which is for working on the runtime,
      # and the test programs, which the AppImage does not carry: they were half of this build's time. Each build
      # step's compiler cache counts are its own: zeroed before, shown after. x86-64's nightlies and releases link with
      # ThinLTO (cmake/lto.cmake), and its test tree, which is this folder, then tests that build; a pull request's do not
      - name: Build and install into /usr
        run: |
          git config --global --add safe.directory '*'
          ccache --zero-stats
          cmake --preset default -DSNX_DEPLOY=OFF -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLVM_DIR="$PWD/.cache/llvm/${{ matrix.arch }}/lib/cmake/llvm" -DSNX_A64_DISASM=OFF -DBUILD_TESTING=OFF \
            -DSNX_LTO=${{ github.event_name != 'pull_request' && matrix.arch == 'x86_64' && 'ON' || 'OFF' }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default
          ccache --show-stats
      # The script names the AppImage after `git describe`
      - name: Make the AppImage
        run: scripts/make-appimage.sh
      # Only what the script made: dist/ also holds the tracked desktop entry and icon
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: |
            dist/*.AppImage*
            dist/appinfo
      # The AppImage as a user gets it (scripts/check-package.sh), on a push, the nightly and a run by hand: a pull
      # request's run checks no package. In a container of its own, a plain Ubuntu with none of this job's tools and
      # libraries, where the checkout and build tree the runtime was built in (/__w/...) are not: this job's own
      # checkout would stand in for what an installed copy lacks. The workspace is there at /github/workspace
      - name: Run the AppImage as a user would
        if: github.event_name != 'pull_request'
        uses: docker://ubuntu:24.04
        with:
          entrypoint: bash
          args: scripts/check-package.sh dist/ScarletNX-linux-${{ matrix.arch }}.AppImage
      # out of /usr, by the list that install wrote, which the next one replaces: the tests run with no copy of
      # ScarletNX installed there
      - name: Take the install out of /usr
        run: xargs -d '\n' rm -f -- < build/default/install_manifest.txt
      # Amberlith runs the AppImage's runtime as it was built, installed apart: the tree takes the test options below
      - name: Stage the install for Amberlith
        if: steps.runs.outputs.any == 'true'
        run: cmake --install build/default --prefix stage
      # The test tools this image lacks, and Arch's own Mesa back, which the tests run lavapipe with: the debloated one
      # is for the AppImage alone. lld and mold: the two linkers gnuabi_litmus links its guest with. gdb: the gdbserver
      # gdbstub_native drives. jq: scripts/pr-builds.sh, which pr_builds tests. github-cli: Amberlith's download. Each
      # pacman install is tried 3 times, as Install git says
      - name: Install the test tools
        env:
          AMBERLITH: ${{ steps.runs.outputs.any }}
        run: |
          packages="lld mold qemu-user pkgconf libxtst libxrandr libxss vulkan-swrast vulkan-validation-layers gdb jq"
          [ "$AMBERLITH" = true ] && packages="$packages github-cli"
          for try in 1 2 3; do
            pacman -S --noconfirm mesa && pacman -S --noconfirm --needed $packages && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # Unicorn 2.1.4, the A32 and Thumb differentials' reference (SNX_TEST_ARM_DIFF), and the header and library the
      # native back ends' tests link, in a venv: Arch's Python takes no pip install of its own. The wheels, by their
      # SHA-256 on PyPI (x86-64's and AArch64's). PyPI drops a connection now and then, so it is tried 3 times, 5 s apart
      - name: Install Unicorn
        run: |
          python -m venv --system-site-packages .cache/unicorn
          cat > .cache/unicorn/requirements.txt <<'EOF'
          unicorn==2.1.4 \
            --hash=sha256:9d6e6dea140560de4ebd8446661f7ef84a357d428c14a3ef09dacd306ec8c239 \
            --hash=sha256:bd1fb0c9af5f57e356d8a96928b4fe045b2e18f308ef23b481d5f970008aa722
          EOF
          for try in 1 2 3; do
            .cache/unicorn/bin/pip install --quiet --require-hashes --only-binary :all: -r .cache/unicorn/requirements.txt && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # The test options on the AppImage's tree, its tests on, and the headless tree, whose options change what every
      # target builds, in a folder of its own with this job's LLVM. The A64 disassembler, which the AppImage leaves out,
      # is back in AArch64's test tree; on x86-64 linux-sanitizers' tree has it
      - name: Build the tests and the headless Vulkan tree
        shell: bash
        env:
          UNICORN: ${{ steps.unicorn.outputs.unicorn }}
        run: |
          ccache --zero-stats
          options=()
          if [ "$UNICORN" = true ]; then
            wheel=$(.cache/unicorn/bin/python -c 'import os, unicorn; print(os.path.dirname(os.path.abspath(unicorn.__file__)))')
            options=(-DSNX_UNICORN_INCLUDE_DIR="$wheel/include" -DSNX_UNICORN_LIBRARY="$wheel/lib/libunicorn.so.2")
          fi
          cmake build/default ${{ env.SNX_TEST_OPTIONS }} -DBUILD_TESTING=ON \
            -DSNX_A64_DISASM=${{ matrix.arch == 'aarch64' && 'ON' || 'OFF' }} \
            -DPython3_EXECUTABLE="$PWD/.cache/unicorn/bin/python" "${options[@]}"
          cmake --build build/default --parallel "$(getconf _NPROCESSORS_ONLN)"
          ccache --show-stats
          ccache --zero-stats
          cmake --preset default -B build/headless ${{ env.SNX_HEADLESS_OPTIONS }} -DBUILD_TESTING=ON \
            -DLLVM_DIR="$PWD/.cache/llvm/${{ matrix.arch }}/lib/cmake/llvm" -DSNX_A64_DISASM=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/headless --parallel "$(getconf _NPROCESSORS_ONLN)"
          ccache --show-stats
      # The SDL3 fallback is CMake's (cpmfile.json pins SDL3) and the Windows job builds the same SDL3 from source.
      # Built on every push; on a pull request on AArch64 alone, when it changes a CMake file, a pin or this workflow
      - name: Look for CMake changes
        id: cmake-changed
        if: matrix.arch == 'aarch64' && github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          if grep -qE '(^|/)CMakeLists\.txt$|\.cmake$|^CMakePresets\.json$|^cpmfile\.json$|^\.github/workflows/build\.yml$' <<<"$changed"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the SDL3 fallback without a system package
        if: github.event_name != 'pull_request' || steps.cmake-changed.outputs.yes == 'true'
        run: |
          ccache --zero-stats
          cmake --preset default -B build/sdl-fallback -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON \
            -DSNX_DEPLOY=OFF -DBUILD_TESTING=OFF -DSDL_WAYLAND=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/sdl-fallback --target scarletnx --parallel "$(getconf _NPROCESSORS_ONLN)"
          ccache --show-stats
      # Only what this run used is kept, so the cache saved is one build's worth of every tree. The disk left is said:
      # the trees share the runner's
      - name: Trim the compiler cache
        run: |
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
          df -h .
      # Not from a pull request: only that pull request would read what it saved, and it builds as fast from main's.
      # The repository's caches share 10 GB, the least recently read evicted first, and a cache of each run's own
      # pushes out main's LLVM builds and system roots, which every run reads
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the dependency builds this run's trees used stay, under a key named after them: saved when they changed
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # vulkan_headless again in the variants that take another path on lavapipe: a change that passes the plain run
      # and breaks one of them is found here, not on a GPU later. Left out: mesh (lavapipe has no subgroups of 32, so
      # it is the plain run), descriptor_heaps (heaps are lavapipe's default already), libraries (the plain run under
      # the validation layer, which pipeline_library_linked has) and descriptor_buffers_uma (each of its two alone).
      # As many at a time as the runner has cores, as each run keeps its shaders and frames in a folder of its own
      # (tests/vulkan_headless.c)
      - name: Test headless Vulkan and NX runtime
        run: ctest --test-dir build/headless -R '^(vulkan_headless|vulkan_headless_options|vulkan_headless_vic_validation|vulkan_headless_pipeline_library_whole|vulkan_headless_pipeline_library_linked|vulkan_headless_libraries_off|vulkan_headless_vk12|vulkan_headless_descriptor_buffers|vulkan_headless_cb_windows|vulkan_headless_vertex_input_off|vulkan_headless_uma|vulkan_headless_hot|vulkan_recorder|vulkan_tex_partial|vulkan_video_av1|nx_runtime_homebrew|nx_runtime_homebrew_64k_pages|vulkan_storage_buffer_keep|vulkan_nvn_savestate|vulkan_owned_page_reads|vulkan_owned_page_reads_protection|astc_vulkan_sync|astc_vulkan_encode_dot)$' --output-on-failure --parallel "$(getconf _NPROCESSORS_ONLN)"
      # The game modules compile src/common/cpu/aarch64/cpu_helpers.c, which no CMake target does
      - name: Check the ABI helpers compile
        run: clang -std=gnu23 -fsyntax-only -Wall -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        run: ctest --test-dir build/default -LE '^unicorn$' --output-on-failure --parallel 4
      # The code of the native back ends that no job runs, each test by its name, then what each machine ran: one that ran
      # none fails (scripts/unicorn-tests.py), as ctest passes a test the build has not
      - name: Test the native back ends under Unicorn
        if: steps.unicorn.outputs.unicorn == 'true'
        shell: bash
        run: |
          status=0
          ctest --test-dir build/default -L '^unicorn$' --no-tests=error --output-on-failure --parallel 4 \
            --output-junit "$PWD/unicorn.xml" || status=$?
          python3 scripts/unicorn-tests.py unicorn.xml || status=1
          exit "$status"
      - name: Check optional Python diagnostics
        run: |
          python -m compileall -q tools
          python tools/run_game.py --help > /dev/null
      # gh fetches through the REST API: the releases/download link answered 504 for hours on 2026-11-08. 3 tries each.
      # The nightly's NRO is named for its version and commit, amberlith-<version>-<commit>.nro; one that cannot be
      # fetched or checked is a warning, and its run is left out
      - name: Fetch Amberlith
        id: fetch
        if: steps.runs.outputs.any == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NRO: ${{ steps.runs.outputs.nro }}
          APK: ${{ steps.runs.outputs.apk }}
          MAIN: ${{ steps.runs.outputs.main }}
        run: |
          fetch() { # TAG FILE SHA256
            for try in 1 2 3; do
              gh release download "$1" -R scarletnx/amberlith -p "$2" --clobber && break
              [ "$try" = 3 ] && return 1
              sleep 30
            done
            echo "$3  $2" | sha256sum -c -
          }
          if [ "$NRO" = true ]; then
            if [ -z "$EDENPROBE_SHA256" ]; then
              echo "EDENPROBE_SHA256 is empty: pin the sha256 of $EDENPROBE_NRO" >&2
              exit 1
            fi
            fetch "$EDENPROBE_VERSION" "$EDENPROBE_NRO" "$EDENPROBE_SHA256" || exit 1
          fi
          if [ "$APK" = true ]; then
            fetch "$EDENPROBE_APK_VERSION" "$EDENPROBE_APK" "$EDENPROBE_APK_SHA256" || exit 1
          fi
          if [ "$MAIN" = true ]; then
            mkdir -p edenprobe-nightly
            if gh release download nightly -R scarletnx/amberlith -D edenprobe-nightly -p 'amberlith-*.nro' \
                -p 'amberlith-*.nro.sha256' &&
              mv edenprobe-nightly/amberlith-*.nro edenprobe-main.nro &&
              mv edenprobe-nightly/amberlith-*.nro.sha256 edenprobe-main.nro.sha256 &&
              echo "$(cut -d ' ' -f 1 edenprobe-main.nro.sha256)  edenprobe-main.nro" | sha256sum -c -; then
              echo "main=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Amberlith main::Amberlith's nightly could not be fetched or checked"
            fi
          fi
      # The runs called for, one after the other, each with its own output, summary and exit: the NRO and the APK held to
      # their baselines, Amberlith's main beside the release's baseline, warnings only. Not side by side: the NRO's kernel
      # family times its threads, and with the others beside it at the lowest priority, so that it passes, the runs took
      # no less time in all than one after the other. The NRO runs with no FPS limit (fps-limit=0): its vsync comes every
      # millisecond, not at 60 Hz, so no case waits on a display; scarletnx-android has no such setting.
      # Each summary's title is a line of the pull request's comment, as a notice of this job that scripts/pr-builds.sh
      # reads back once the run ends, and finds by this step's name; on one line, % is all a notice escapes
      - name: Run Amberlith
        id: amberlith
        if: steps.runs.outputs.any == 'true'
        shell: bash
        env:
          NRO: ${{ steps.runs.outputs.nro }}
          APK: ${{ steps.runs.outputs.apk }}
          MAIN: ${{ steps.fetch.outputs.main }}
        run: |
          # NAME ARGS...: one run, its output in NAME.log, its status in NAME.status
          probe() {
            local name=$1
            shift
            local began=$(date +%s) code=0
            python3 scripts/edenprobe.py run --runtime stage/bin/scarletnx "$@" --summary "$name.md" \
              > "$name.log" 2>&1 || code=$?
            echo "$code" > "$name.status"
            echo "$name: $(($(date +%s) - began)) s" >> times.txt
          }
          began=$(date +%s)
          : > times.txt
          [ "$NRO" = true ] && probe edenprobe --nro "$EDENPROBE_NRO" --mode "$EDENPROBE_MODE" --out edenprobe \
            --baseline tests/edenprobe/linux-x86_64.txt --setting fps-limit=0
          [ "$APK" = true ] && probe edenprobe-android --apk "$EDENPROBE_APK" --mode "$EDENPROBE_APK_MODE" \
            --out edenprobe-android --baseline tests/edenprobe/android-x86_64.txt
          [ "$MAIN" = true ] && probe edenprobe-main --nro edenprobe-main.nro --mode "$EDENPROBE_MODE" \
            --out edenprobe-main --advisory-baseline tests/edenprobe/linux-x86_64.txt --setting fps-limit=0
          status=0
          for name in edenprobe edenprobe-android edenprobe-main; do
            [ -f "$name.status" ] || continue
            echo "::group::$name, exit $(cat "$name.status")"
            cat "$name.log"
            echo "::endgroup::"
            [ -f "$name.md" ] && cat "$name.md" >> "$GITHUB_STEP_SUMMARY"
            if [ "$name" != edenprobe-main ]; then
              if [ -f "$name/summary.md" ]; then
                result=$(head -n 1 "$name/summary.md" | cut -c5-)
                echo "::notice title=edenprobe::${result//%/%25}"
              fi
              [ "$(cat "$name.status")" = 0 ] || status=1
            fi
          done
          echo "the runs: $(($(date +%s) - began)) s in all; $(tr '\n' ';' < times.txt)"
          exit "$status"
      # The reports, the failures' pictures, the logs and the runs' baseline.txt; not the recompiled game. Each attempt
      # its own: a run takes one artifact of a name, and a job run again keeps the earlier attempt's to compare
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.amberlith.outcome == 'success' || steps.amberlith.outcome == 'failure') }}
        with:
          name: edenprobe-${{ steps.commit.outputs.short }}-${{ github.run_attempt }}
          path: |
            edenprobe
            !edenprobe/work
            edenprobe-main
            !edenprobe-main/work
            edenprobe-android
            !edenprobe-android/work
            *.log
            times.txt
          if-no-files-found: ignore
      # A run stops at its first failed job, whatever its event: the jobs done keep their results, and the others are
      # cancelled instead of building for nothing. A failed job marks its run with this artifact, and the jobs still
      # running cancel the run once this one has ended (scripts/fail-fast.py), so it keeps its failure: a job that
      # cancels its own run ends cancelled, which hides what failed. Not in a job that may fail (SNX_OPTIONAL_JOBS).
      # The mark's file is written in the workspace, which every job has before its checkout too: upload-artifact takes
      # no path with a . or .. in it, and the workspace is the one place a host's and a container's step both reach by a
      # relative path. Git Bash on Windows, where MSYS2's shell may not be set up yet
      - &fail-fast-file
        name: Name the failed job for the mark
        if: failure()
        shell: bash
        run: echo "$GITHUB_JOB" > fail-fast-mark.txt
      - &fail-fast-mark
        name: Mark the run failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fail-fast-${{ github.run_attempt }}
          path: fail-fast-mark.txt
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  # x86-64 with ASan and UBSan (SNX_TEST_SANITIZERS): every test, and the programs and libraries of ours it runs or
  # links, built with them (runtime_architecture names any left out), so our code reading memory after it was freed or
  # past its end fails on every run, not only where it happens to crash. A report stops the program that made it, a code
  # generator of the build or a test, and fails the job, printed whole. A job of its own, so a run waits for the longer
  # of the two and not for both. The sources and the FFmpeg, OpenSSL and SPIRV-Tools builds, which the sanitizers leave
  # as they are, are x86-64's appimage job's, restored and not saved
  linux-sanitizers:
    name: Linux (x86_64, ASan + UBSan)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    container: archlinux:latest
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # a block only a stale stack slot or register still points at is a leak, on every machine alike: with them
      # read, what a leak check finds depends on what the stack happened to hold at exit
      LSAN_OPTIONS: use_stacks=0:use_registers=0
      # the loader keeps a driver loaded past vkDestroyInstance: what the driver made once stays reachable from its
      # globals, where an unloaded driver's would read as a leak of an unknown module (lavapipe's 128 bytes,
      # 3ds_addons)
      VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING: 1
    steps:
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # pacman's packages, which it takes before its mirrors: this week's cache, else last week's
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ github.job }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-${{ github.job }}-
      # the appimage job's build and test tools, without the AppImage's (poppler, as there, for the x86-64 back end)
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja meson make patch nasm perl python git clang lld mold llvm qemu-user pkgconf sdl3 libx11 libxtst libxrandr libxss mesa vulkan-icd-loader vulkan-swrast vulkan-validation-layers ccache gdb jq glslang jdk21-openjdk poppler && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # Saved once a week, as in the appimage job
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      # the whole history, which deprecations_check reads
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *fail-fast-watch
      - uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpmutil-linux-x86_64-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-linux-x86_64-
      - uses: actions/cache/restore@v5
        with:
          path: .cache/deps
          key: deps-appimage-x86_64-${{ github.run_id }}
          restore-keys: deps-appimage-x86_64-
      # this job's newest, else the appimage job's
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ github.job }}-
            ccache-appimage-x86_64-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build with the sanitizers
        run: |
          git config --global --add safe.directory '*'
          ccache --zero-stats
          cmake --preset default -B build/sanitizers -DBUILD_TESTING=ON -DSNX_TEST_SANITIZERS=ON -DSNX_TEST_VP9_VECTORS=ON \
            -DSNX_DEPLOY=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/sanitizers --parallel "$(getconf _NPROCESSORS_ONLN)"
          ccache --show-stats
      # Trimmed and saved as in the appimage job
      - name: Trim the compiler cache
        run: |
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
          df -h .
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The leaks of the system's libraries that are theirs to free (tests/lsan.supp), by the absolute path LSan needs:
      # the tests start programs from folders of their own
      - name: Test under the sanitizers
        run: |
          LSAN_OPTIONS="$LSAN_OPTIONS:suppressions=$PWD/tests/lsan.supp" \
            ctest --test-dir build/sanitizers --output-on-failure --parallel 4
      - *fail-fast-file
      - *fail-fast-mark

  # Which of the recompiler's long tests a pull request changes what they test of (scripts/recompiler-changes.py): the A64
  # differential on the cross builds (qemu-reference's recording, appimage-cross's run of it), which no pull request makes
  # now, and the native back ends of the other machines under Unicorn (the appimage job, which asks the script itself). A
  # push, a nightly and a run by hand run them whatever changed, and every Linux job's tests run the differential on their
  # own host
  recompiler-changes:
    name: Recompiler changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      differential: ${{ steps.changed.outputs.differential }}
      unicorn: ${{ steps.changed.outputs.unicorn }}
    steps:
      # the pull request's merge commit and the base it is diffed against
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Look for what the recompiler's long tests test
        id: changed
        shell: bash
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          python3 scripts/recompiler-changes.py <<<"$changed" >> "$GITHUB_OUTPUT"
      - *fail-fast-file
      - *fail-fast-mark

  # The cross jobs (appimage-cross) can't run qemu-aarch64 beside a host binary that qemu-user runs: the QEMU side of
  # the A64 differential is recorded here, once, and handed over as an artifact. A job of its own, so the cross jobs
  # wait for these two targets and not for the Linux tests. The sources, the dependency builds and the compiler cache
  # are x86-64's appimage job's, restored and not saved; pacman's packages its own, Arch's image being another
  qemu-reference:
    name: A64 differential's QEMU reference
    needs: recompiler-changes
    # the cross builds' reference alone (appimage-cross), which a pull request does not run
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # pacman's packages, which it takes before its mirrors: this week's cache, else last week's
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ github.job }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-${{ github.job }}-
      # jdk21-openjdk: javac and jni.h, which the Android app driver (src/android) configures with; poppler: pdftotext
      # (cmake/sdm.cmake)
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja make patch nasm perl python git clang lld llvm qemu-user pkgconf sdl3 libxtst libxrandr libxss vulkan-swrast vulkan-validation-layers ccache gdb jq glslang jdk21-openjdk poppler && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # Saved once a week, as in the appimage job
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpmutil-linux-x86_64-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-linux-x86_64-
      - uses: actions/cache/restore@v5
        with:
          path: .cache/deps
          key: deps-appimage-x86_64-${{ github.run_id }}
          restore-keys: deps-appimage-x86_64-
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-appimage-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-appimage-x86_64-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
          } >> "$GITHUB_ENV"
      - name: Build the differential and its runner
        run: |
          cmake --preset default -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --target snx-test-llvm-qemu-differential snx_qemu_ref_runner
          ccache --show-stats
      - name: Record the A64 differential's QEMU reference
        run: |
          build/default/tests/snx-test-llvm-qemu-differential qemu-aarch64 build/default/qemu_ref_runner \
            build/llvm_qemu_reference_dir tests/llvm_qemu_expected.txt --quiet \
            --record build/llvm_qemu_reference.bin
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-llvm-qemu-reference-${{ steps.commit.outputs.short }}
          path: build/llvm_qemu_reference.bin
      - *fail-fast-file
      - *fail-fast-mark

  # The AppImages of hosts no GitHub runner is: cross-built on x86-64 with their linux-<arch>-cross preset
  # (cmake/cross.cmake) against the system root of pkgforge's Arch image of the architecture, then bundled in a
  # container of that image, whose / holds the runtime, and made on the build machine. The build container is
  # pkgforge's x86-64 image with the workspace at /src; platform is Docker's name of the architecture (loong64 for
  # LoongArch). Big-endian ppc64's has every runtime (the 3DS one builds there but isn't ported to a big-endian host):
  # Arch POWER's glibc there is ELFv2, not Debian ports' ELFv1, which no job builds or tests. No POWER, RISC-V or
  # LoongArch machine has run the AppImages yet, so like the macOS and iOS jobs they may fail without failing the run
  # (scripts/publish-builds.py, OPTIONAL). On a push the AppImage made is run as installed at the end, through qemu
  appimage-cross:
    name: Linux AppImage (${{ matrix.arch }})
    needs: qemu-reference
    # Not in a pull request: the nightlies' builds (a push, a schedule or a manual run). Pull requests left out
    # big-endian ppc64, their one cross build, to make their runs shorter. Without a reference to run against, the
    # build and the launcher's tests alone
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
      (needs.qemu-reference.result == 'success' || needs.qemu-reference.result == 'skipped') }}
    runs-on: ubuntu-26.04
    # LLVM's cross build (scripts/linux-llvm.sh) adds about half an hour where its cache misses
    timeout-minutes: 180
    continue-on-error: true
    env:
      QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/quick-sharun.sh
      QUICK_SHARUN_SHA: 0aea2f589658e5db1659a6ccb8d29546c4e03028f1e29b37c6450cece917249a
      APPIMAGETOOL_URL: https://github.com/pkgforge-dev/appimagetool/releases/download/0.5.6/appimagetool-full-x86_64-linux
      APPIMAGETOOL_SHA: a92214d831d234d1be31699657c572799e5c8417c9abf129e2f748cc9c612f85
      DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/get-debloated-pkgs.sh
      DEBLOATED_PACKAGES_SHA: d215f7676785f1a1bb8784e69085d66c1df81488ef31f1ba7198325a5be05130
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: ppc64le, platform: ppc64le, preset: linux-ppc64le-cross, qemu: ppc64le}
          - {arch: riscv64, platform: riscv64, preset: linux-riscv64-cross, qemu: riscv64}
          - {arch: loongarch64, platform: loong64, preset: linux-loongarch64-cross, qemu: loongarch64}
          - {arch: ppc64, platform: ppc64, preset: linux-ppc64-elfv2-cross, qemu: ppc64}
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *fail-fast-watch
      # The qemu-reference job's recorded QEMU side of the A64 differential, run here against the cross-built test
      - if: needs.qemu-reference.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-llvm-qemu-reference-${{ steps.commit.outputs.short }}
          path: reference
      # The four cross builds run on x86-64 and fetch the same sources (SDL3 is the system root's package, as the linux
      # job's is), so they share one cache. The first to finish saves it
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-linux-cross-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-linux-cross-
      # ccache and the dependency builds, as in the appimage job. The container builds as root: what it makes in them
      # goes back to the runner's user before each is saved
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      # The AppImage as installed runs through the runner's qemu-user (scripts/check-package.sh says why): installed
      # before the handlers below are registered, as its package's systemd trigger can clear the handlers registered
      # before it. No recommends: qemu-user-binfmt would register handlers of its own. ppc64's step installs its own
      - name: Install qemu-user
        if: github.event_name != 'pull_request' && matrix.platform != 'ppc64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      # The script's checks run the AppImage it made: the kernel runs the target's programs through qemu once their
      # binfmt handlers are registered, in the container too
      - name: Set up qemu emulation for ${{ matrix.arch }}
        if: matrix.platform != 'ppc64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}
      # tonistiigi/binfmt, which setup-qemu-action registers, has no big-endian ppc64: the runner's qemu-user runs its
      # programs instead, by the magic and mask Debian's qemu-user-binfmt gives them (its qemu-ppc64.conf). F opens
      # qemu now, so the containers use it too, and P keeps argv[0], as qemu reads from the kernel since 9.0
      - name: Set up qemu emulation for ppc64
        if: matrix.platform == 'ppc64'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
          # the build container has none of the runner's libraries: its qemu has to be static, as Debian's is since 9.2
          ! ldd "$(command -v qemu-ppc64)" 2>&1 | grep -q '=>' ||
            { echo "the runner's qemu-ppc64 is dynamically linked, which the build container cannot run" >&2; exit 1; }
          printf ':qemu-ppc64:M::%s:%s:%s:POCF\n' \
            '\x7f\x45\x4c\x46\x02\x02\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x15' \
            '\xff\xff\xff\xff\xff\xff\xff\xfc\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff' \
            "$(command -v qemu-ppc64)" | sudo tee /proc/sys/fs/binfmt_misc/register
          head -n 3 /proc/sys/fs/binfmt_misc/qemu-ppc64
      # The system root with the target's libraries installed (scripts/appimage-sysroot.sh), made again each week and
      # whenever the script changes: Arch moves on, and the root's packages with it
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: sysroot
        with:
          path: sysroot
          key: sysroot-${{ matrix.arch }}-${{ hashFiles('scripts/appimage-sysroot.sh') }}-${{ steps.week.outputs.week }}
      # The build container's packages of this week's cache, else last week's, which pacman takes before its mirrors:
      # mounted as its package cache
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: ${{ runner.temp }}/pacman
          key: pacman-${{ github.job }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-${{ github.job }}-
      # The target container is where the packages and then the runtime go: / is the image, so pacman, quick-sharun
      # and get-debloated-pkgs work unmodified. A pull request bundles nothing, so it starts none
      - name: Start the build and target containers
        run: |
          mkdir -p "$RUNNER_TEMP/pacman"
          docker run --detach --name build --volume "$PWD:/src" --volume "$RUNNER_TEMP/pacman:/var/cache/pacman/pkg" \
            --workdir /src ghcr.io/pkgforge-dev/archlinux:latest sleep infinity
          [ "$GITHUB_EVENT_NAME" = pull_request ] ||
            docker run --detach --name target --platform linux/${{ matrix.platform }} \
              --volume "$PWD:/src" --workdir /src ghcr.io/pkgforge-dev/archlinux:latest sleep infinity
      - name: Unpack the ${{ matrix.arch }} system root
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          image=ghcr.io/pkgforge-dev/archlinux:latest
          docker pull --platform linux/${{ matrix.platform }} "$image"
          docker exec build mkdir -p /src/sysroot
          docker export "$(docker create --platform linux/${{ matrix.platform }} "$image")" | docker exec -i build tar -x -C /src/sysroot
      # The pinned Anylinux-AppImages tools and the target's libraries the runtime links and bundles: binutils and
      # patchelf are what quick-sharun needs on PATH. get-debloated-pkgs then replaces the full Mesa (its libgallium
      # links libLLVM), ICU and Opus, so it runs last. Each pacman is tried 3 times, as in the appimage job. The token
      # is get-debloated-pkgs' api.github.com rate limit, the one the appimage job's copy is given
      - name: Install the target container's tools and libraries
        if: github.event_name != 'pull_request'
        env:
          LINUX_ONLY: ${{ matrix.linux-only && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker exec -i -e QUICK_SHARUN -e QUICK_SHARUN_SHA -e DEBLOATED_PACKAGES -e DEBLOATED_PACKAGES_SHA \
            -e LINUX_ONLY -e GITHUB_TOKEN target sh -s <<'EOF'
          set -eu
          libraries="patchelf binutils"
          [ -n "$LINUX_ONLY" ] || libraries="$libraries sdl3 libx11 mesa vulkan-icd-loader vulkan-radeon vulkan-swrast
            libxext libxcursor libxfixes libxi libxinerama libxrandr libxrender libxss libxtst libxkbcommon wayland
            wayland-protocols libdecor alsa-lib libpulse libpipewire hidapi libusb"
          retry() { for try in 1 2 3; do "$@" && return; [ "$try" = 3 ] && return 1; sleep 5; done; }
          # A port whose openssl is already 4 while some of its packages still link OpenSSL 3 refuses the upgrade
          # unless its openssl-3 comes along; a port still on OpenSSL 3 has no such package
          retry pacman -Sy --noconfirm
          if pacman -Si openssl-3 >/dev/null 2>&1; then libraries="$libraries openssl-3"; fi
          # -Suu: the image may also be ahead of the port's repo (the appimage job's Install git says how)
          retry pacman -Suu --noconfirm --needed $libraries
          curl -fsSL --retry 15 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o /usr/local/bin/quick-sharun "$QUICK_SHARUN"
          curl -fsSL --retry 15 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o /usr/local/bin/get-debloated-pkgs "$DEBLOATED_PACKAGES"
          chmod +x /usr/local/bin/quick-sharun /usr/local/bin/get-debloated-pkgs
          printf '%s  %s\n' "$QUICK_SHARUN_SHA" /usr/local/bin/quick-sharun \
                           "$DEBLOATED_PACKAGES_SHA" /usr/local/bin/get-debloated-pkgs | sha256sum -c
          debloated="opus-mini icu-mini"
          [ -n "$LINUX_ONLY" ] || debloated="mesa-nano $debloated"
          get-debloated-pkgs $debloated
          EOF
      # The build machine's packaging tool: quick-sharun makes the AppImage, and this appimagetool compresses natively,
      # takes the target's runtime from APPIMAGE_ARCH, and resolves mkdwarfs for this machine rather than the target's
      - name: Install the packaging tools
        if: github.event_name != 'pull_request'
        run: |
          docker exec -i -e QUICK_SHARUN -e QUICK_SHARUN_SHA -e APPIMAGETOOL_URL -e APPIMAGETOOL_SHA build sh -s <<'EOF'
          set -eu
          curl -fsSL --retry 15 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o /usr/local/bin/quick-sharun "$QUICK_SHARUN"
          curl -fsSL --retry 15 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o /usr/local/bin/appimagetool "$APPIMAGETOOL_URL"
          chmod +x /usr/local/bin/quick-sharun /usr/local/bin/appimagetool
          printf '%s  %s\n' "$QUICK_SHARUN_SHA" /usr/local/bin/quick-sharun \
                           "$APPIMAGETOOL_SHA" /usr/local/bin/appimagetool | sha256sum -c
          EOF
      # The build machine's: Clang and LLD build for the target (cmake/cross.cmake) and LLVM's libraries for it
      # (scripts/linux-llvm.sh), ccache caches the compiles, glslang builds the shaders, qemu-user runs the target's
      # own programs, wayland's wayland-scanner the protocols SDL3 builds, jdk21-openjdk the Android app driver's javac
      # and jni.h, meson dav1d for the target (cmake/dav1d.cmake, from a cross file). Each pacman is tried 3 times, as
      # in the appimage job
      - name: Install the build tools
        run: |
          docker exec -i build sh -s <<'EOF'
          set -eu
          retry() { for try in 1 2 3; do "$@" && return; [ "$try" = 3 ] && return 1; sleep 5; done; }
          retry pacman -Syu --noconfirm --needed cmake ninja make patch perl python clang lld llvm glslang qemu-user \
            git pkgconf patchelf wayland ccache jdk21-openjdk meson
          EOF
      # Saved once a week, as in the appimage job. Every architecture's job installs the same, so one of them saves it
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: docker exec build pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pacman
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      # The target's libraries, where the root wasn't in the cache, saved before anything of this build goes in. The
      # runner's user saves it, and the root's files are root's
      - name: Install the target's libraries
        if: steps.sysroot.outputs.cache-hit != 'true'
        env:
          LINUX_ONLY: ${{ matrix.linux-only && '--linux-only' || '' }}
        run: |
          docker exec -i -e LINUX_ONLY build sh -s <<'EOF'
          set -eu
          scripts/appimage-sysroot.sh /src/sysroot $LINUX_ONLY
          chown -R "$(stat -c %u:%g /src)" /src/sysroot
          chmod -R u+rwX /src/sysroot
          EOF
      - if: steps.sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: sysroot
          key: ${{ steps.sysroot.outputs.cache-primary-key }}
      # LLVM's libraries for the target, as the appimage job builds its own, cross-built against the system root
      - name: Name the LLVM version
        id: llvm
        run: echo "version=$(docker exec build llvm-config --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: llvm-cache
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: linux-llvm-cross-${{ matrix.arch }}-${{ hashFiles('scripts/linux-llvm.sh', 'scripts/llvm-libraries/CMakeLists.txt', 'cmake/llvm_components.cmake') }}-${{ steps.llvm.outputs.version }}
      - name: Cross-build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          docker exec -i -e LLVM_VERSION=${{ steps.llvm.outputs.version }} build sh -s <<'EOF'
          set -eu
          SNX_SYSROOT=/src/sysroot scripts/linux-llvm.sh ${{ matrix.arch }} /src/.cache/llvm/${{ matrix.arch }}
          chown -R "$(stat -c %u:%g /src)" /src/.cache/llvm
          EOF
      - if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      # When this run's compiles start: what ccache keeps is what they used (Keep what this run compiled, below)
      - name: Name the compiles' start
        id: compiles
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # Through ccache, without debug information, which no one reads in these builds and the AppImage would carry.
      # LLVM is the one built above (-DSNX_LLVM_CONFIG= drops the preset's, the system root's), SDL3 the system root's
      # package (SNX_SYSTEM_SDL3: a root without it, or with one too old, stops the configure), and a release leaves
      # out scarletnx --mcp's A64 disassembler (SNX_A64_DISASM)
      - name: Cross-build and install
        run: |
          docker exec -i -e CCACHE_DIR=/src/.cache/ccache -e CCACHE_BASEDIR=/src -e CCACHE_NOHASHDIR=true \
            -e SNX_DEPS_CACHE=/src/.cache/deps build sh -s <<'EOF'
          set -eu
          git config --global --add safe.directory '*'
          export SNX_SYSROOT=/src/sysroot
          cmake --preset ${{ matrix.preset }} -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF \
            -DSNX_OPT_FLAGS="-O2 -g0" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_DIR=/src/.cache/llvm/${{ matrix.arch }}/lib/cmake/llvm -DSNX_LLVM_CONFIG= -DSNX_A64_DISASM=OFF \
            -DSNX_SYSTEM_SDL3=ON
          cmake --build --preset ${{ matrix.preset }} --parallel "$(getconf _NPROCESSORS_ONLN)"
          DESTDIR=/src/stage cmake --install build/${{ matrix.preset }}
          mkdir -p /src/.cache/deps
          chown -R "$(stat -c %u:%g /src)" /src/.cache/ccache /src/.cache/deps
          EOF
      # The A64 differential against the qemu-reference job's recording: the cross build's tests are off, so the
      # one test is configured and built alone, then run here through qemu-user, with and without the generic path
      - name: Run the A64 differential against the recorded QEMU reference
        if: needs.qemu-reference.result == 'success'
        run: |
          docker exec -i -e CCACHE_DIR=/src/.cache/ccache -e CCACHE_BASEDIR=/src -e CCACHE_NOHASHDIR=true \
            -e SNX_DEPS_CACHE=/src/.cache/deps build sh -s <<'EOF'
          set -eu
          git config --global --add safe.directory '*'
          export SNX_SYSROOT=/src/sysroot
          cmake --preset ${{ matrix.preset }} -DBUILD_TESTING=ON \
            -DSNX_OPT_FLAGS="-O2 -g0" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_DIR=/src/.cache/llvm/${{ matrix.arch }}/lib/cmake/llvm -DSNX_LLVM_CONFIG= -DSNX_A64_DISASM=OFF \
            -DSNX_SYSTEM_SDL3=ON
          cmake --build --preset ${{ matrix.preset }} --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --target snx-test-llvm-qemu-differential
          # both forms run, and a failing one's examples go to the log: the container's /tmp goes with the job. A form
          # takes minutes; at 20 its SIGBUS makes the test name the case it was in, where a hang would hold the job 3 hours
          # the two forms at once, each with one thread and its own folder
          for form in host generic; do
            flag=; [ "$form" = generic ] && flag=--generic
            ( timeout -s BUS -k 30 1200 \
              qemu-${{ matrix.qemu }} -L /src/sysroot build/${{ matrix.preset }}/tests/snx-test-llvm-qemu-differential \
              /tmp/llvm_qemu_reference_$form /src/tests/llvm_qemu_expected.txt \
              --reference /src/reference/llvm_qemu_reference.bin --quiet $flag > /tmp/differential_$form.log 2>&1 \
              && echo 0 > /tmp/differential_$form.status || echo $? > /tmp/differential_$form.status ) &
          done
          wait
          failed=0
          for form in host generic; do
            cat /tmp/differential_$form.log
            if [ "$(cat /tmp/differential_$form.status)" != 0 ]; then
              failed=1
              cat /tmp/llvm_qemu_reference_$form/llvm_qemu_mismatches.txt || true
            fi
          done
          exit $failed
          EOF
      # The launcher's tests on the target through qemu-user, as the preset's test preset runs them (QEMU_LD_PREFIX for
      # the programs a test starts, which the binfmt handler above runs): what the AppImage's launcher draws, reads and
      # writes, on a big-endian host too. The tree is the differential's, with every launcher test built. gui_sdl_events
      # stops at the Settings' groups under qemu in these containers, whatever the architecture (#2017)
      - name: Run the launcher's tests through qemu
        run: |
          docker exec -i -e CCACHE_DIR=/src/.cache/ccache -e CCACHE_BASEDIR=/src -e CCACHE_NOHASHDIR=true \
            -e SNX_DEPS_CACHE=/src/.cache/deps build sh -s <<'EOF'
          set -eu
          git config --global --add safe.directory '*'
          export SNX_SYSROOT=/src/sysroot
          cmake --preset ${{ matrix.preset }} -DBUILD_TESTING=ON \
            -DSNX_OPT_FLAGS="-O2 -g0" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_DIR=/src/.cache/llvm/${{ matrix.arch }}/lib/cmake/llvm -DSNX_LLVM_CONFIG= -DSNX_A64_DISASM=OFF \
            -DSNX_SYSTEM_SDL3=ON
          cmake --build --preset ${{ matrix.preset }} --parallel "$(getconf _NPROCESSORS_ONLN)" --target snx_gui_tests
          ctest --preset ${{ matrix.preset }} -R '^gui_' -E '^gui_sdl_events$' -j"$(getconf _NPROCESSORS_ONLN)"
          EOF
      # Only what this run compiled is kept, as in the appimage job: the AppImage's, the differential's and the launcher
      # tests'. The container builds as root, and the runner's user saves the cache
      - name: Keep what this run compiled
        env:
          START: ${{ steps.compiles.outputs.start }}
        run: |
          docker exec -i -e CCACHE_DIR=/src/.cache/ccache -e START build sh -s <<'EOF'
          set -eu
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
          chown -R "$(stat -c %u:%g /src)" /src/.cache/ccache
          EOF
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # Packaging runs where / is the target's system root, so quick-sharun reads it and the licenses' packages come
      # from its pacman database; the AppImage itself is compressed on the build machine. Not on a pull request: no
      # one runs its AppImage, which took half of the job's time, and a push to main and the nightly bundle it
      - name: Bundle the AppImage
        if: github.event_name != 'pull_request'
        run: |
          for try in 1 2 3; do
            if docker exec -i target sh -s <<'EOF'
          set -eu
          rm -f "${TMPDIR:-/tmp}"/cross-libc-dlopen-*.tar
          cp -a /src/stage/. /
          SKIP_APPIMAGE=1 scripts/make-appimage.sh
          EOF
            then
              break
            fi
            [ "$try" = 3 ] && exit 1
            echo "the bundle failed; trying again in 30 seconds" >&2
            sleep 30
          done
      - name: Make the AppImage
        if: github.event_name != 'pull_request'
        run: |
          docker exec -i -e GITHUB_REPOSITORY -e GITHUB_REF_TYPE -e VERSION="$(git describe --always --dirty)" \
            -e MAKE_APPIMAGE_ONLY=1 -e ARCH=${{ matrix.arch }} -e APPIMAGETOOL=/usr/local/bin/appimagetool \
            build sh -s <<'EOF'
          set -eu
          scripts/make-appimage.sh
          EOF
      - name: Check the AppImage
        if: github.event_name != 'pull_request'
        run: |
          docker exec -i -e ARCH=${{ matrix.arch }} build sh -s <<'EOF'
          set -eu
          scripts/check-appimage.sh
          EOF
      # Only what the script made: dist/ also holds the tracked desktop entry and icon
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: |
            dist/*.AppImage*
            dist/appinfo
      # actions/cache saves .cache/cpm as the runner's user, and its tar fails on what the container's root made that
      # only root may open: FFmpeg's tarball has its top directory 0700
      - name: Give the dependency sources back to the runner
        run: |
          docker exec build chown -R "$(id -u):$(id -g)" /src/.cache/cpm
          # tar saves a link as a link, whatever it points at
          unreadable=$(find .cache/cpm ! -type l ! -readable)
          [ -z "$unreadable" ] || { printf 'actions/cache cannot read:\n%s\n' "$unreadable" >&2; exit 1; }
      # The AppImage as a user gets it, on a push, the nightly and a run by hand, on this runner, which has neither the
      # checkout nor the build tree where the build container had them (/src). Each game the AppImage makes is a copy of
      # it, and an AppImage carries "AI\x02" in its ELF header's padding, where the target's handler wants zeros: one
      # more handler, made from the AppImage's own first 20 bytes with the padding left out, runs them through
      # qemu-user. P keeps argv[0], by which the AppImage's runtime runs the dwarfs tool it carries as itself; both
      # handlers are printed. e_type's low byte, executable or shared, is left to either: byte 16 of a little-endian
      # header, 17 of a big-endian one (EI_DATA 2, PowerPC64 BE's)
      - name: Run ${{ matrix.arch }} AppImages through qemu-user
        if: github.event_name != 'pull_request'
        run: |
          set -- $(head -c 20 dist/*.AppImage | od -An -v -tx1)
          low=$(($6 == 2 ? 17 : 16))
          magic= mask= i=0
          for byte in "$@"; do
            case $i in 7|8|9|10|11|12|13|14|15) byte=00 m=00 ;; "$low") m=fe ;; *) m=ff ;; esac
            magic=$magic\\x$byte mask=$mask\\x$m i=$((i + 1))
          done
          printf ':appimage-%s:M::%s:%s:%s:POCF\n' ${{ matrix.qemu }} "$magic" "$mask" "$(command -v qemu-${{ matrix.qemu }})" |
            sudo tee /proc/sys/fs/binfmt_misc/register
          grep -qx enabled /proc/sys/fs/binfmt_misc/appimage-${{ matrix.qemu }}
          head -n 3 /proc/sys/fs/binfmt_misc/qemu-${{ matrix.qemu }} /proc/sys/fs/binfmt_misc/appimage-${{ matrix.qemu }}
      - name: Run the AppImage as a user would
        if: github.event_name != 'pull_request'
        run: |
          grep -qx enabled /proc/sys/fs/binfmt_misc/qemu-${{ matrix.qemu }} ||
            { echo "no binfmt handler runs ${{ matrix.qemu }} programs here" >&2; exit 1; }
          scripts/check-package.sh dist/ScarletNX-linux-${{ matrix.arch }}.AppImage

  # x86-64 and AArch64 (Windows on Arm, in MSYS2's CLANGARM64): the same steps, each with its own caches. The x86-64
  # leg keeps the name the branch rules require
  windows:
    name: Windows (Clang + LLVM${{ matrix.arch == 'aarch64' && ', aarch64' || '' }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-2025-vs2026' }}
    timeout-minutes: 90
    # the Windows on Arm leg may fail without failing the run (SNX_OPTIONAL_JOBS): its failure mark is read and passed
    # over by name, and the nightly publishes its zip only when it built
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      # as the other jobs' fail-fast-watch, with the runner's Python: MSYS2's comes later
      - name: Cancel the run when another job fails
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fail-fast.py start
      # Git for Windows checks out with the core.autocrlf of its own system config (true), which MSYS2's git, the
      # build's, does not read: every text file would read as changed to it, and the build line say -dirty
      - name: Keep the checkout's line ends for MSYS2's git
        shell: bash
        run: git config --local core.autocrlf "$(git config core.autocrlf || echo false)"
      # Windows fetches SDL3's source, which Linux takes from its package, so this job's set is its own, one for each
      # architecture (x86-64 fetches glslang-tools, AArch64 uses MSYS2's glslang: cmake/glsl.cmake), and the restore
      # key carries a cpmfile.json bump over
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-windows-${{ matrix.arch }}-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-windows-${{ matrix.arch }}-
      # ccache, set up as in the appimage job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      # the dependency builds, as in the appimage job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # llvm-mingw alone has no LLVM development libraries. Do not mix its C++ runtime with another LLVM build. meson:
      # dav1d's build (cmake/dav1d.cmake), as in the appimage job; poppler: pdftotext (cmake/sdm.cmake), x86-64's alone
      - name: Install Clang, LLVM development files and FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.arch == 'aarch64' && 'CLANGARM64' || 'CLANG64' }}
          update: true
          path-type: strict
          install: >-
            git
            make
            patch
            perl
            patchutils
            mingw-w64-clang-${{ matrix.arch }}-glslang
            mingw-w64-clang-${{ matrix.arch }}-clang
            mingw-w64-clang-${{ matrix.arch }}-llvm
            mingw-w64-clang-${{ matrix.arch }}-lld
            mingw-w64-clang-${{ matrix.arch }}-cmake
            mingw-w64-clang-${{ matrix.arch }}-ninja
            mingw-w64-clang-${{ matrix.arch }}-meson
            mingw-w64-clang-${{ matrix.arch }}-nasm
            mingw-w64-clang-${{ matrix.arch }}-pkgconf
            mingw-w64-clang-${{ matrix.arch }}-python
            mingw-w64-clang-${{ matrix.arch }}-ccache
            ${{ matrix.arch == 'x86_64' && 'mingw-w64-clang-x86_64-poppler' || '' }}
      - name: Check required dependencies
        run: |
          set -euo pipefail
          clang --version
          llvm-config --version
          test -f "$(llvm-config --includedir)/llvm-c/Core.h"
          test -d "$(llvm-config --libdir)"
          llvm-config --libs core native passes target analysis
          make --version
          perl --version
          nasm --version
          meson --version
      - name: Build the runtime and pinned dependencies
        run: |
          set -euo pipefail
          # the JDK the Android app driver (src/android) builds with: the runner's 21, as the android job's Gradle takes
          jdk=JAVA_HOME_21_${{ matrix.arch == 'aarch64' && 'AARCH64' || 'X64' }}
          export JAVA_HOME="${!jdk:?the runner has no JDK 21 in $jdk}"
          # the nightlies and releases link with ThinLTO (cmake/lto.cmake), a pull request's build does not
          cmake --preset default -DSNX_LTO=${{ github.event_name != 'pull_request' && 'ON' || 'OFF' }} \
            -DSNX_LLVM_CONFIG="$(cygpath -m "$(command -v llvm-config)")" \
            -DSNX_FFMPEG_SH="$(cygpath -m /usr/bin/sh.exe)" \
            -DSNX_FFMPEG_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DPERL_EXECUTABLE="$(cygpath -m /usr/bin/perl.exe)" \
            -DSNX_OPENSSL_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DSNX_DEPLOY=OFF -DBUILD_TESTING=ON -DSNX_TEST_VP9_VECTORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default --prefix stage
      # "-dirty" in the build line means a tracked file changed on the runner: none did, so the line of the build just
      # made has none, and a file changed now gets one
      - name: Check the build line names the checkout as it is
        run: |
          set -euo pipefail
          # the commit's define alone: a branch's name may end in -dirty too
          dirty() { grep -q '^#define SNX_COMMIT "[^"]*-dirty"' "$1"; }
          printf '#define SNX_BRANCH "a-dirty"\n#define SNX_COMMIT "abc1234"\n' > build/default/commit-check.h
          if dirty build/default/commit-check.h; then
            echo "a branch named a-dirty reads as a commit with changes" >&2
            exit 1
          fi
          ctest --test-dir build/default -R '^build_info$' --verbose | grep -F 'ScarletNX '
          if dirty build/default/generated/snx_commit.h; then
            echo "the build line says -dirty; the tracked files MSYS2's git sees changed:" >&2
            git status --porcelain --untracked-files=no | head -20 >&2
            echo "$(git status --porcelain --untracked-files=no | wc -l) files; read with CR LF line ends:" \
              "$(git -c core.autocrlf=true status --porcelain --untracked-files=no | wc -l)" >&2
            for g in git '/c/Program Files/Git/bin/git.exe'; do # MSYS2's, and the checkout's
              echo "core.autocrlf, $g: $("$g" config --show-origin core.autocrlf || echo unset)" >&2
            done
            exit 1
          fi
          echo >> README.md
          cmake -DSRC=. -DOUT=build/default/commit-check.h -P cmake/commit.cmake
          git checkout -- README.md
          if ! dirty build/default/commit-check.h; then
            echo "README.md changed, and the build line would say $(cat build/default/commit-check.h)" >&2
            exit 1
          fi
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # Explorer and the taskbar show the first icon of an executable's resources, and Windows reads its application
      # manifest from them (runtime.rc)
      - name: Check the executables' icon and manifest
        run: |
          set -euo pipefail
          for exe in stage/bin/scarletnx.exe; do
            # the whole listing first: grep -q stopping early would fail the pipe under pipefail
            resources=$(llvm-readobj --coff-resources "$exe")
            if ! grep -q 'Type: GROUP_ICON' <<<"$resources"; then
              echo "$exe has no icon" >&2
              exit 1
            fi
            # the manifest is kept there as text
            if ! grep -aqF '>SegmentHeap</heapType>' "$exe"; then
              echo "$exe has no manifest with heapType SegmentHeap (runtime.manifest)" >&2
              exit 1
            fi
          done
      - name: Check the native driver
        run: |
          set -euo pipefail
          build/default/scarletnx.exe --help > /dev/null
          build/default/scarletnx.exe --extract --help > /dev/null
          build/default/scarletnx.exe --recomp --help > /dev/null
      - name: Test native tooling and indexed filesystems
        run: |
          set -euo pipefail
          ctest --test-dir build/default --output-on-failure --parallel 4
      - name: Bundle runtime DLLs and licenses
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Follow imports recursively so the artifact works without MSYS2 on PATH.
          # Windows system DLLs are supplied by Windows, never copied from the runner.
          binaries=(stage/bin/*.exe stage/bin/*.dll)
          for ((i = 0; i < ${#binaries[@]}; ++i)); do
            imports=$(llvm-objdump -p "${binaries[i]}")
            while IFS= read -r dll; do
              source="$MINGW_PREFIX/bin/$dll"
              destination="stage/bin/$dll"
              if [[ -f "$source" && ! -f "$destination" ]]; then
                cp "$source" "$destination"
                binaries+=("$destination")
              fi
            done < <(printf '%s\n' "$imports" | awk '/DLL Name:/ { sub(/\r$/, "", $3); print $3 }')
          done
          mkdir -p stage/share/licenses/msys2
          cp -R "$MINGW_PREFIX/share/licenses/." stage/share/licenses/msys2/
          pacman -Q > stage/share/licenses/msys2/build-packages.txt
      - name: Check the artifact without the toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$(Resolve-Path stage/bin);$env:SystemRoot\System32;$env:SystemRoot"
          & .\stage\bin\scarletnx.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-windows-${{ matrix.arch }}-${{ steps.commit.outputs.short }}
          path: stage
          if-no-files-found: error
      # The zip as a user gets it (scripts/check-package.sh), on a push, the nightly and a run by hand: a pull request's
      # run checks no package. In Git Bash: setup-msys2 puts only its msys2.cmd's folder on PATH, so no DLL of MSYS2's
      # stands in for one the zip lacks. A copy installed from a build tree never takes that tree's checkout
      # (snx_checkout), so the checkout and build/ left in place stand in for nothing either
      - name: Run the zip's scarletnx.exe as a user would
        if: github.event_name != 'pull_request'
        shell: bash
        run: bash scripts/check-package.sh stage/bin/scarletnx.exe
      - *fail-fast-file
      - *fail-fast-mark

  # The Android app (docs/hosts/android-app.md), both ABIs on one runner, with the runner's Gradle and JDK. LLVM's libraries for an
  # ABI take most of an hour, so they are kept until the script that builds them changes (both cold: about two hours).
  # Each ABI packs an APK of its own, then one APK holds both
  android:
    name: Android APK
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - *fail-fast-watch
      # One cache for both ABIs, and the restore key carries a cpmfile.json bump over
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-android-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-android-
      # Each ABI's LLVM is saved as soon as it is built, as the apple job saves its own: the hour of one is kept when
      # the other's build or a later step fails, or the run is cancelled
      - uses: actions/cache/restore@v5
        id: llvm-x86_64
        with:
          path: android-llvm/x86_64
          key: android-llvm-x86_64-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      - uses: actions/cache/restore@v5
        id: llvm-arm64
        with:
          path: android-llvm/arm64-v8a
          key: android-llvm-arm64-v8a-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      # The NDK named above, which the runner's image may no longer carry, NASM for FFmpeg's and dav1d's x86-64
      # assembly, and meson for dav1d (cmake/dav1d.cmake, from a cross file). sdkmanager's download sometimes ends early
      # ("Premature EOF"): tried 3 times, 5 s apart
      - name: Install the NDK, NASM and meson
        run: |
          for try in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_ROOT##*/}" > /dev/null && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          sudo apt-get update && sudo apt-get install -y nasm meson ccache
      - name: Build LLVM's libraries for x86_64
        if: steps.llvm-x86_64.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh x86_64 "$PWD/android-llvm/x86_64"
      - if: steps.llvm-x86_64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: android-llvm/x86_64
          key: ${{ steps.llvm-x86_64.outputs.cache-primary-key }}
      - name: Build LLVM's libraries for arm64-v8a
        if: steps.llvm-arm64.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh arm64-v8a "$PWD/android-llvm/arm64-v8a"
      - if: steps.llvm-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: android-llvm/arm64-v8a
          key: ${{ steps.llvm-arm64.outputs.cache-primary-key }}
      # ccache, set up as in the appimage job: one for both ABIs, which compile apart
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      # the dependency builds, as in the appimage job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      # the plugin graph of the APK: AGP 9 and the Kotlin plugin that comes with it, which Gradle fetches into its home
      # on every cold run. A fetch that fails stops the APK after the native build has passed, and nothing else in this
      # job needs Maven Central, so the downloads stay between runs
      - uses: actions/cache@v5
        with:
          path: .cache/gradle/caches
          key: gradle-android-${{ hashFiles('dist/android/**') }}
          restore-keys: gradle-android-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            # the NDK is installed afresh on each run: its version, not its files' dates, says which compiler it is
            echo "CCACHE_COMPILERCHECK=string:$ANDROID_NDK_ROOT"
            echo "GRADLE_USER_HOME=$ws/.cache/gradle"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # One key signs every APK, so each installs over the one before (docs/hosts/android-app.md): the ANDROID_KEYSTORE secret, a
      # keystore in base64. A fork's pull request has no secrets: its APKs carry the runner's own debug key, said here
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/scarletnx.keystore"
            echo "SNX_ANDROID_KEYSTORE=$RUNNER_TEMP/scarletnx.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: the runner's own debug key signs this APK, so it does not" \
              "install over one the repository's key signed"
          fi
      # each ABI in a tree and stage of its own, so its APK holds it alone
      - name: Build each ABI's native libraries and APK
        env:
          SNX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for abi in x86_64 arm64-v8a; do
            # arm64-v8a's nightlies and releases link with ThinLTO (cmake/lto.cmake), x86_64's and a pull request's not
            lto=OFF
            [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$abi" = arm64-v8a ] && lto=ON
            JAVA_HOME=$JAVA_HOME_21_X64 scripts/android-apk.sh "$PWD/build/android-$abi" "$PWD/android-llvm" "$abi" -- \
              -DSNX_LTO=$lto -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cp "build/android-$abi/stage/gradle/outputs/apk/debug/ScarletNX-debug.apk" \
              "ScarletNX-android-$abi-${{ steps.commit.outputs.short }}.apk"
          done
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # both ABIs' libraries, SDL's Java and the icon in one stage, without each APK's Gradle output
      - name: Pack the APK of both ABIs
        env:
          SNX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir stage
          for abi in x86_64 arm64-v8a; do cp -a "build/android-$abi/stage/." stage/; done
          rm -rf stage/gradle
          JAVA_HOME=$JAVA_HOME_21_X64 gradle -p dist/android assembleDebug -Pscarletnx.stage="$PWD/stage" \
            ${SNX_ANDROID_KEYSTORE:+"-Pscarletnx.keystore=$SNX_ANDROID_KEYSTORE"}
          cp stage/gradle/outputs/apk/debug/ScarletNX-debug.apk ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
      # the certificate it carries, in the log; with the repository's key, the one ANDROID_CERT_SHA256 (a variable) names
      - name: Check the APK's signer
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # "Signer #1 certificate ...", "V2 Signer: certificate ..." (apksigner 37) or, for a signer of some SDK
          # versions, "Signer (minSdkVersion=...) certificate ..."
          cert=$(sed -n -E 's/^(V[0-9.]+ )?Signer[^:]*:? certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" |
                 sort -u)
          if [ -z "$cert" ] || [ "$(wc -l <<< "$cert")" != 1 ]; then
            echo "::error::apksigner names no one certificate of $apk"
            exit 1
          fi
          echo "signed by the certificate of SHA-256 $cert"
          if [ -n "${SNX_ANDROID_KEYSTORE:-}" ] && [ -n "$EXPECTED" ] && [ "$cert" != "$EXPECTED" ]; then
            echo "::error::signed by $cert, not the repository's key ($EXPECTED)"
            exit 1
          fi
      # A library that needs one Android 5.0 lacks fails to load there, and the app with it
      - name: Check the APK's libraries
        run: |
          set -euo pipefail
          apk=ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          mkdir apk && unzip -q "$apk" 'lib/*' -d apk
          system=" libc.so libm.so libdl.so liblog.so libandroid.so libz.so libEGL.so libGLESv1_CM.so libGLESv2.so libOpenSLES.so "
          for abi in x86_64 arm64-v8a; do
            for lib in libmain.so libscarletnx.so libscarletnx-run.so; do
              test -f "apk/lib/$abi/$lib" || { echo "$abi has no $lib" >&2; exit 1; }
              for needed in $("$readelf" -d "apk/lib/$abi/$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
                [[ "$system" == *" $needed "* || -f "apk/lib/$abi/$needed" ]] ||
                  { echo "$abi/$lib needs $needed, which Android 5.0 does not have" >&2; exit 1; }
              done
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      # Not zipped: each artifact is an APK itself, named after it
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-x86_64-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-arm64-v8a-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      # The app's unit tests (docs/hosts/android-app.md), on the stage the APK was packed from: its classes build against SDL's
      # Java and the icon there. Last, so a test that fails fails the job and still leaves the APKs to try
      - name: Test the app's Java
        run: JAVA_HOME=$JAVA_HOME_21_X64 gradle -p dist/android testDebugUnitTest -Pscarletnx.stage="$PWD/stage"
      - *fail-fast-file
      - *fail-fast-mark

  # macOS and iOS (docs/hosts/apple.md), both on one Apple silicon runner with Xcode's Clang and SDKs; FFmpeg, OpenSSL and
  # SDL3 are built from the pinned sources as everywhere. Until both have built green once, a failure here does not
  # fail the run (continue-on-error), which would hold back the nightly: they are new, and no Mac checked them before
  # CI. iOS builds even when macOS failed, and each one's app is made from its own build alone. Each app carries
  # Ryujinx's MoltenVK (V380-Ori/Ryujinx.MoltenVK): mainline's lacks patches emulators' pipelines need. The release's
  # tars, their SHA-256 the ones GitHub lists for them
  apple:
    name: macOS and iOS (arm64)
    runs-on: macos-26
    timeout-minutes: 240
    continue-on-error: true
    env:
      MOLTENVK_RELEASE: v1.4.1-ryujinx
      MOLTENVK_MACOS_SHA256: ea1c633808d0a61e86ee35af4bdc280f5f07f95633b95935f3e695dc5226e640
      MOLTENVK_IOS_SHA256: 7cec48d4e73cf9eb89b60e8596758900caaf8398c49ae8abe4544295fb7e0c84
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - *fail-fast-watch
      # macOS and iOS fetch the same sources (SDL3's among them, which Linux takes from its package): one cache, and
      # the restore key carries a cpmfile.json bump over
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-apple-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-apple-
      # LLVM's libraries for each (scripts/apple-llvm.sh) with AArch64's code generator alone, the one the recompiler
      # uses, built once per script and Xcode. Saved as soon as they are built: actions/cache saves only a job that
      # succeeds, and a later step's failure would build them again next run. Xcode's Clang builds everything, as a
      # user's Mac does
      - name: Name the Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: macos-llvm
        with:
          path: apple-llvm
          key: macos-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      # iOS is the nightlies' alone: a pull request builds and tests macOS (the iOS steps below skip there too)
      - uses: actions/cache/restore@v5
        id: ios-llvm
        if: github.event_name != 'pull_request'
        with:
          path: ios-llvm
          key: ios-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      # meson: dav1d's build (cmake/dav1d.cmake), with a native file on macOS and a cross file on iOS
      - name: Install tools
        run: brew install ninja meson ccache
      - name: Build LLVM's libraries for macOS
        id: macos-llvm-build
        if: steps.macos-llvm.outputs.cache-hit != 'true'
        run: scripts/apple-llvm.sh macos "$PWD/apple-llvm"
      - if: steps.macos-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: apple-llvm
          key: ${{ steps.macos-llvm.outputs.cache-primary-key }}
      - name: Build LLVM's libraries for iOS
        id: ios-llvm-build
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ios-llvm.outputs.cache-hit != 'true' }}
        run: scripts/apple-llvm.sh ios "$PWD/ios-llvm"
      - if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ios-llvm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ios-llvm
          key: ${{ steps.ios-llvm.outputs.cache-primary-key }}
      # ccache and the dependency builds, set up as in the appimage job: one of each for both, which compile apart
      - uses: actions/cache/restore@v5
        if: ${{ !cancelled() }}
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - uses: actions/cache/restore@v5
        if: ${{ !cancelled() }}
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        if: ${{ !cancelled() }}
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$GITHUB_WORKSPACE/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build the runtime for macOS
        id: macos-build
        if: ${{ !cancelled() && steps.macos-llvm-build.outcome != 'failure' }}
        run: |
          # the JDK the Android app driver (src/android) builds with: the runner's 21
          export JAVA_HOME="${JAVA_HOME_21_arm64:?the runner has no JDK 21}"
          # Keep the release's SDL3 static when the later shared-library check installs Homebrew's package.
          cmake --preset macos -DLLVM_DIR="$PWD/apple-llvm/lib/cmake/llvm" -DSNX_TEST_VP9_VECTORS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset macos --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Build the app for iOS
        id: ios-build
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.ios-llvm-build.outcome != 'failure' }}
        run: |
          cmake --preset ios -DLLVM_DIR="$PWD/ios-llvm/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset ios --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Trim the compiler cache
        if: ${{ !cancelled() }}
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        if: ${{ !cancelled() }}
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(shasum -a 256 <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key }}
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      - name: Check the ABI helpers compile
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        run: clang -std=gnu23 -fsyntax-only -Wall -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        run: ctest --test-dir build/macos --output-on-failure --parallel 4
      # A shared SDL3 brings no framework of its own to the link, where CI's pinned static build brings Cocoa and the
      # rest: a Mac user's SDL3 is Homebrew's, and the platform's power watcher must name CoreFoundation itself
      # (cmake/power_frameworks.cmake). The tests that compile plat_posix.c are built against that SDL3 here.
      - name: Build the platform tests against a shared SDL3
        if: ${{ !cancelled() && steps.macos-llvm-build.outcome != 'failure' }}
        run: |
          brew install sdl3
          cmake --preset macos -B build/sdl3-shared -DSNX_SYSTEM_SDL3=ON -DSNX_DEPLOY=OFF \
            -DLLVM_DIR="$PWD/apple-llvm/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/sdl3-shared --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --target snx-test-memory-own snx-test-platform-posix snx-test-memory-alias
      # the app, signed ad hoc, and its zip, by CPack (cmake/apple_package.cmake)
      - name: Make the macOS app
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        run: |
          curl -fL --retry 15 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o moltenvk-macos.tar \
            "https://github.com/V380-Ori/Ryujinx.MoltenVK/releases/download/$MOLTENVK_RELEASE/MoltenVK-macos.tar"
          echo "$MOLTENVK_MACOS_SHA256  moltenvk-macos.tar" | shasum -a 256 -c
          mkdir moltenvk-macos && tar -xf moltenvk-macos.tar -C moltenvk-macos
          cmake build/macos -DSNX_MOLTENVK="$PWD/moltenvk-macos"
          # The executable and the install rules must come from the same dependency configuration.
          cmake --build --preset macos --target scarletnx --parallel "$(getconf _NPROCESSORS_ONLN)"
          cpack --config build/macos/CPackConfig.cmake -B app-macos \
            -D CPACK_PACKAGE_FILE_NAME=ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}
          mv app-macos/ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}.zip .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        with:
          path: ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}.zip
          archive: false
          if-no-files-found: error
      # Unsigned: AltStore, SideStore or a developer account sign it for the device it goes on, with
      # dist/apple/ScarletNX.entitlements
      - name: Make the IPA
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        run: |
          curl -fL --retry 15 --retry-delay 20 --retry-all-errors --connect-timeout 30 -o moltenvk-ios.tar \
            "https://github.com/V380-Ori/Ryujinx.MoltenVK/releases/download/$MOLTENVK_RELEASE/MoltenVK-ios.tar"
          echo "$MOLTENVK_IOS_SHA256  moltenvk-ios.tar" | shasum -a 256 -c
          mkdir moltenvk-ios && tar -xf moltenvk-ios.tar -C moltenvk-ios
          cmake build/ios -DSNX_MOLTENVK="$PWD/moltenvk-ios"
          cpack --config build/ios/CPackConfig.cmake -B app-ios \
            -D CPACK_PACKAGE_FILE_NAME=ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}
          mv app-ios/ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}.ipa .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        with:
          path: ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}.ipa
          archive: false
          if-no-files-found: error
