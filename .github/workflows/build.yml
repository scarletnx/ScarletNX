name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # a version's release (publish.yml)
  pull_request:
    # a draft builds and tests as one ready for review does
    types: [opened, synchronize, reopened]
    # a change only to files no build or test reads skips it (pr-checks.yml's tracked_material.py reads those); the
    # three .md files listed are test inputs
    paths:
      - '**'
      - '!**/*.md'
      - '!.claude/**'
      - '!.gitignore'
      - '!.github/ISSUE_TEMPLATE/**'
      - 'docs/layers/cpu/plan.md'
      - 'docs/user/deprecations.md'
      - 'docs/user/gui.md'
  workflow_dispatch:
  # main every three hours; a commit that has its nightly already cancels its run (nightly-due)
  schedule:
    - cron: '23 */3 * * *'

# A failed job cancels the rest of its run (scripts/fail-fast.py). A run of main that builds everywhere becomes a
# nightly and a pull request's a prerelease, in scarletnx/nightly (publish.yml)
permissions:
  contents: read
  actions: write

# a newer push cancels the run of its pull request, or of main; a tag and a run by hand always run
concurrency:
  group: >-
    build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  # The tests run on a pull request, a run by hand and a version's tag (its release waits on them); a push to main
  # and the nightly build, package and publish. Each test step is `if: env.SNX_TESTS == 'true'`
  # (tests/build_tests_test.py), and every event builds the test trees, so the caches main saves stay warm
  SNX_TESTS: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
    startsWith(github.ref, 'refs/tags/') }}
  SNX_TEST_OPTIONS: -DSNX_TEST_VP9_VECTORS=ON -DSNX_TEST_ARM_AOT=ON -DSNX_TEST_ARM_DIFF=ON -DSNX_TEST_LLVM_SWEEP=ON
  SNX_HEADLESS_OPTIONS: -DSNX_BUILD_GUI=OFF -DSNX_DEPLOY=OFF -DSNX_TEST_VULKAN=ON -DSNX_TEST_AV1_VECTORS=ON
  # the jobs that may fail without failing the run (continue-on-error; tests/fail_fast_test.py)
  SNX_OPTIONAL_JOBS: '^(macOS and iOS \(arm64\)|Windows \(Clang \+ LLVM, aarch64\)|Linux AppImage \((ppc64le|ppc64|riscv64|loongarch64)\))$'

# Linux builds in Arch Linux (Clang and LLVM 23), Windows in MSYS2's CLANG64 or CLANGARM64, Apple with Xcode.
# FFmpeg, OpenSSL, SDL3 and SPIRV-Tools build from the sources cpmfile.json pins, downloaded into .cache/cpm
# (keyed by cpmfile.json and the patches). Compiles go through ccache: each job restores the newest cache a push
# saved, trimmed to what that run used; a pull request saves none. The artifacts are what `cmake --install` puts
# in place, with their licenses
jobs:
  nightly-due:
    name: Nightly due
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Cancel the run when this commit has its nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/scarletnx/nightly/releases/latest" | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
          echo "the newest nightly: $latest; this run: ${GITHUB_SHA::7}"
          case $latest in
          *-"${GITHUB_SHA::7}")
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" ;;
          esac
  # Each Linux architecture: the runtime installed into /usr and its AppImage (Anylinux-AppImages, make-appimage.sh),
  # then the test tree and the headless Vulkan tree, through one compiler cache; where SNX_TESTS, their tests, the
  # AppImage run as installed and, on x86-64, Amberlith's probes
  appimage:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-26.04' }}
    # LLVM's build (scripts/linux-llvm.sh) adds half an hour where its cache misses
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container: ghcr.io/pkgforge-dev/archlinux:latest
    # Amberlith's NRO and APK, pinned releases run against tests/edenprobe/{linux,android}-x86_64.txt
    # (docs/dev/edenprobe.md); another release or other words want those files written again
    env:
      EDENPROBE_VERSION: v1.0.4
      EDENPROBE_NRO: amberlith-1.0.4.nro
      EDENPROBE_SHA256: 3271c4af392cd21e842e1ea89b370eb376da154f039dbe9e7f5c5a2193a2bed0
      # every family that needs no person or network, but graphics (docs/dev/edenprobe.md)
      EDENPROBE_MODE: quick notime cpu fs video display kernel audio hooks
      EDENPROBE_APK_VERSION: v1.0.0
      EDENPROBE_APK: amberlith-1.0.0.apk
      EDENPROBE_APK_SHA256: 192cc7750bac972d0f4d850eea7bbada7a84b3c5b6b24d25d4d8ba7f7b6933d8
      EDENPROBE_APK_MODE: quick
    steps:
      # the commit the artifacts are named after: a pull request's head, else the one pushed
      - &commit
        name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - &week
        name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # pacman's packages: this week's cache, else last week's
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-appimage-${{ matrix.arch }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-appimage-${{ matrix.arch }}-
      # before the checkout, which needs git for the history git describe reads. -Syuu takes an image built ahead of
      # its repo back to it; each pacman is tried 3 times
      - name: Install git
        run: |
          for try in 1 2 3; do
            pacman -Syuu --noconfirm --needed git && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - &checkout-history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-linux-${{ matrix.arch }}-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-linux-${{ matrix.arch }}-
      - &ccache-restore-arch
        uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      # FFmpeg's, OpenSSL's and SPIRV-Tools' builds (cmake/deps_cache.cmake); saved below under a key of what was used
      - &deps-restore
        uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      - &caches-env
        name: Set up the caches
        shell: bash
        run: bash scripts/ci/caches-env.sh
      # the tools its script downloads, pinned to a commit and checked below
      - name: Install the packaging tools
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/make-aur-package.sh
      - name: Check the packaging tools
        run: scripts/ci/linux.sh packaging_check
      - name: Install the build tools and the debloated Mesa
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/linux.sh build_tools
      - &fail-fast-watch
        name: Cancel the run when another job fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fail-fast.py start
      - &pacman-keep
        name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: pacman -Sc --noconfirm >/dev/null
      - &pacman-save
        if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      - name: Name the LLVM version
        id: llvm
        run: echo "version=$(llvm-config --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: llvm-cache
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: linux-llvm-${{ matrix.arch }}-${{ hashFiles('scripts/linux-llvm.sh', 'scripts/llvm-libraries/CMakeLists.txt', 'cmake/llvm_components.cmake') }}-${{ steps.llvm.outputs.version }}
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          LLVM_VERSION: ${{ steps.llvm.outputs.version }}
        run: scripts/linux-llvm.sh ${{ matrix.arch }} "$PWD/.cache/llvm/${{ matrix.arch }}"
      - &llvm-save
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Build and install into /usr
        env:
          LTO: ${{ github.event_name != 'pull_request' && matrix.arch == 'x86_64' && 'ON' || 'OFF' }}
          ARCH: ${{ matrix.arch }}
        run: scripts/ci/linux.sh release
      - name: Make the AppImage
        run: scripts/make-appimage.sh
      - &appimage-upload
        uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: |
            dist/*.AppImage*
            dist/appinfo
      # in a plain Ubuntu, where neither the checkout nor the build tree stands in for what an install lacks
      - name: Run the AppImage as a user would
        uses: docker://ubuntu:24.04
        with:
          entrypoint: bash
          args: scripts/check-package.sh dist/ScarletNX-linux-${{ matrix.arch }}.AppImage
      # the tests run with no copy of ScarletNX in /usr
      - name: Take the install out of /usr
        run: xargs -d '\n' rm -f -- < build/default/install_manifest.txt
      - name: Stage the install for Amberlith
        if: matrix.arch == 'x86_64' && env.SNX_TESTS == 'true'
        run: cmake --install build/default --prefix stage
      - name: Install the test tools
        env:
          AMBERLITH: ${{ matrix.arch == 'x86_64' && env.SNX_TESTS == 'true' }}
        run: scripts/ci/linux.sh test_tools
      - name: Install Unicorn
        run: scripts/ci/linux.sh unicorn_venv
      - name: Build the tests and the headless Vulkan tree
        env:
          A64_DISASM: ${{ matrix.arch == 'aarch64' && 'ON' || 'OFF' }}
          ARCH: ${{ matrix.arch }}
          UNICORN: ${{ matrix.arch == 'x86_64' }}
        run: scripts/ci/linux.sh test_trees
      - name: Build the SDL3 fallback without a system package
        run: scripts/ci/linux.sh sdl_fallback
      - &ccache-trim
        name: Trim the compiler cache
        run: |
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
          df -h .
      # not a pull request's: no one else reads it, and the repository's 10 GB would lose main's LLVM builds
      - &ccache-save-arch
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - &deps-name
        name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - &deps-save
        if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # vulkan_headless in the variants that take another path on lavapipe (tests/vulkan_headless.c)
      - name: Test headless Vulkan and NX runtime
        if: env.SNX_TESTS == 'true'
        run: ctest --test-dir build/headless -R '^(vulkan_headless|vulkan_headless_options|vulkan_headless_vic_validation|vulkan_headless_pipeline_library_whole|vulkan_headless_pipeline_library_linked|vulkan_headless_libraries_off|vulkan_headless_vk12|vulkan_headless_descriptor_buffers|vulkan_headless_cb_windows|vulkan_headless_vertex_input_off|vulkan_headless_uma|vulkan_headless_hot|vulkan_recorder|vulkan_tex_partial|vulkan_video_av1|nx_runtime_homebrew|nx_runtime_homebrew_64k_pages|vulkan_storage_buffer_keep|vulkan_nvn_savestate|vulkan_owned_page_reads|vulkan_owned_page_reads_protection|astc_vulkan_sync|astc_vulkan_encode_dot)$' --output-on-failure --parallel "$(getconf _NPROCESSORS_ONLN)"
      # compiled by the game modules, by no CMake target
      - name: Check the ABI helpers compile
        run: clang -std=gnu23 -fsyntax-only -Wall -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        if: env.SNX_TESTS == 'true'
        run: scripts/ci/linux.sh tests
      - name: Check optional Python diagnostics
        if: env.SNX_TESTS == 'true'
        run: |
          python -m compileall -q tools
          python tools/run_game.py --help > /dev/null
      - name: Fetch Amberlith
        id: fetch
        if: matrix.arch == 'x86_64' && env.SNX_TESTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/linux.sh amberlith_fetch
      - name: Run Amberlith
        id: amberlith
        if: matrix.arch == 'x86_64' && env.SNX_TESTS == 'true'
        env:
          MAIN: ${{ steps.fetch.outputs.main }}
        run: scripts/ci/linux.sh amberlith_run
      # the reports, pictures, logs and baselines; one artifact per attempt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.amberlith.outcome == 'success' || steps.amberlith.outcome == 'failure') }}
        with:
          name: edenprobe-${{ steps.commit.outputs.short }}-${{ github.run_attempt }}
          path: |
            edenprobe
            !edenprobe/work
            edenprobe-main
            !edenprobe-main/work
            edenprobe-android
            !edenprobe-android/work
            *.log
            times.txt
          if-no-files-found: ignore
      - name: Make the x86-64 instruction selection again
        if: matrix.arch == 'x86_64' && env.SNX_TESTS == 'true'
        run: scripts/ci/linux.sh x64_isel
      # A failed job marks its run with this artifact, and the jobs still running cancel it (scripts/fail-fast.py), so
      # the run keeps the failure. Written in the workspace, which a host's and a container's step both reach
      - &fail-fast-file
        name: Name the failed job for the mark
        if: failure()
        shell: bash
        run: echo "$GITHUB_JOB" > fail-fast-mark.txt
      - &fail-fast-mark
        name: Mark the run failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fail-fast-${{ github.run_attempt }}
          path: fail-fast-mark.txt
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  # x86-64 under ASan and UBSan (SNX_TEST_SANITIZERS): every test, our programs and libraries built with them
  # (runtime_architecture names any left out). A push builds it, for the cache, and tests nothing
  linux-sanitizers:
    name: Linux (x86_64, ASan + UBSan)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    container: archlinux:latest
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # leaks read alike on every machine, whatever the stack held at exit
      LSAN_OPTIONS: use_stacks=0:use_registers=0
      # a driver unloaded would read as a leak of an unknown module
      VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING: 1
    steps:
      - *week
      # pacman's packages: this week's cache, else last week's
      - &pacman-restore
        uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ github.job }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-${{ github.job }}-
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja meson make patch nasm perl python git clang lld mold llvm qemu-user pkgconf sdl3 libx11 libxtst libxrandr libxss mesa vulkan-icd-loader vulkan-swrast vulkan-validation-layers ccache gdb jq glslang jdk21-openjdk && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - *pacman-keep
      - *pacman-save
      - *checkout-history
      - *fail-fast-watch
      - &cpm-restore-x86_64
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpmutil-linux-x86_64-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-linux-x86_64-
      - &deps-restore-x86_64
        uses: actions/cache/restore@v5
        with:
          path: .cache/deps
          key: deps-appimage-x86_64-${{ github.run_id }}
          restore-keys: deps-appimage-x86_64-
      - &ccache-restore-x86_64
        uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ github.job }}-
            ccache-appimage-x86_64-
      - *caches-env
      - name: Build with the sanitizers
        run: scripts/ci/linux.sh sanitizers_build
      - *ccache-trim
      - &ccache-save
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      # the system's libraries' leaks (tests/lsan.supp), by the absolute path LSan needs
      - name: Test under the sanitizers
        if: env.SNX_TESTS == 'true'
        run: |
          LSAN_OPTIONS="$LSAN_OPTIONS:suppressions=$PWD/tests/lsan.supp" \
            ctest --test-dir build/sanitizers --output-on-failure --parallel 4
      - *fail-fast-file
      - *fail-fast-mark

  # The other machines' native back ends under Unicorn (ctest -L unicorn), beside the appimage job; Arch's LLVM, as
  # linux-sanitizers. A push builds it, for the cache, and tests nothing
  linux-unicorn:
    name: Linux (x86_64, other machines under Unicorn)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    container: archlinux:latest
    steps:
      - *week
      - *pacman-restore
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja meson make patch nasm perl python git clang lld llvm pkgconf sdl3 libx11 libxtst libxrandr libxss mesa vulkan-icd-loader ccache glslang jdk21-openjdk && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - *pacman-keep
      - *pacman-save
      - *checkout-history
      - *fail-fast-watch
      - *cpm-restore-x86_64
      - *deps-restore-x86_64
      - *ccache-restore-x86_64
      - *caches-env
      - name: Install Unicorn
        run: scripts/ci/linux.sh unicorn_venv
      - name: Build the tests under Unicorn
        run: scripts/ci/linux.sh unicorn_tree
      - *ccache-trim
      - *ccache-save
      - name: Test the native back ends under Unicorn
        if: env.SNX_TESTS == 'true'
        run: scripts/ci/linux.sh unicorn_tests
      - *fail-fast-file
      - *fail-fast-mark

  # The QEMU side of the A64 differential, recorded once for the cross jobs, which can't run qemu-aarch64 beside
  # their own qemu-user
  qemu-reference:
    name: A64 differential's QEMU reference
    # where SNX_TESTS, which a job's if cannot read
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - *commit
      - *week
      - *pacman-restore
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja make patch nasm perl python git clang lld llvm qemu-user pkgconf sdl3 libxtst libxrandr libxss vulkan-swrast vulkan-validation-layers ccache gdb jq glslang jdk21-openjdk && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - *pacman-keep
      - *pacman-save
      - uses: actions/checkout@v7
      - *cpm-restore-x86_64
      - *deps-restore-x86_64
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-appimage-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-appimage-x86_64-
      - *caches-env
      - name: Build the differential and its runner
        run: scripts/ci/linux.sh qemu_reference_build
      - name: Record the A64 differential's QEMU reference
        run: scripts/ci/linux.sh qemu_reference_record
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-llvm-qemu-reference-${{ steps.commit.outputs.short }}
          path: build/llvm_qemu_reference.bin
      - *fail-fast-file
      - *fail-fast-mark

  # The AppImages of hosts no GitHub runner is: cross-built on x86-64 (cmake/cross.cmake) against the system root of
  # pkgforge's Arch image of the architecture, bundled in a container of that image and made on the build machine.
  # They may fail without failing the run (OPTIONAL in scripts/publish-builds.py). Where SNX_TESTS, the tests
  # through qemu, the A64 differential against qemu-reference's recording, and the AppImage run as installed
  appimage-cross:
    name: Linux AppImage (${{ matrix.arch }})
    needs: qemu-reference
    if: >-
      ${{ !cancelled() && (needs.qemu-reference.result == 'success' || needs.qemu-reference.result == 'skipped') }}
    runs-on: ubuntu-26.04
    # LLVM's cross build (scripts/linux-llvm.sh) adds half an hour where its cache misses
    timeout-minutes: 180
    continue-on-error: true
    env:
      QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/quick-sharun.sh
      QUICK_SHARUN_SHA: 0aea2f589658e5db1659a6ccb8d29546c4e03028f1e29b37c6450cece917249a
      APPIMAGETOOL_URL: https://github.com/pkgforge-dev/appimagetool/releases/download/0.5.6/appimagetool-full-x86_64-linux
      APPIMAGETOOL_SHA: a92214d831d234d1be31699657c572799e5c8417c9abf129e2f748cc9c612f85
      DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/ab06090c5b7946beb6efb04b9feea39362f6898e/useful-tools/get-debloated-pkgs.sh
      DEBLOATED_PACKAGES_SHA: d215f7676785f1a1bb8784e69085d66c1df81488ef31f1ba7198325a5be05130
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: ppc64le, platform: ppc64le, preset: linux-ppc64le-cross, qemu: ppc64le}
          - {arch: riscv64, platform: riscv64, preset: linux-riscv64-cross, qemu: riscv64}
          - {arch: loongarch64, platform: loong64, preset: linux-loongarch64-cross, qemu: loongarch64}
          - {arch: ppc64, platform: ppc64, preset: linux-ppc64-elfv2-cross, qemu: ppc64}
    steps:
      - *commit
      - *checkout-history
      - *fail-fast-watch
      - if: needs.qemu-reference.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-llvm-qemu-reference-${{ steps.commit.outputs.short }}
          path: reference
      # one cache for the four, as they fetch the same sources
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-linux-cross-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-linux-cross-
      - *ccache-restore-arch
      - *deps-restore
      # before the handlers below, which its package's trigger would clear; no recommends: no handlers of its own
      - name: Install qemu-user
        if: env.SNX_TESTS == 'true' && matrix.platform != 'ppc64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Set up qemu emulation for ${{ matrix.arch }}
        if: matrix.platform != 'ppc64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}
      - name: Set up qemu emulation for ppc64
        if: matrix.platform == 'ppc64'
        run: scripts/ci/cross.sh binfmt_ppc64
      - *week
      - uses: actions/cache/restore@v5
        id: sysroot
        with:
          path: sysroot
          key: sysroot-${{ matrix.arch }}-${{ hashFiles('scripts/appimage-sysroot.sh') }}-${{ steps.week.outputs.week }}
      # the build container's pacman cache, mounted
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: ${{ runner.temp }}/pacman
          key: pacman-${{ github.job }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-${{ github.job }}-
      - name: Start the build and target containers
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/cross.sh containers
      - name: Unpack the ${{ matrix.arch }} system root
        if: steps.sysroot.outputs.cache-hit != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/ci/cross.sh sysroot
      - name: Install the target container's tools and libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/cross.sh target_tools
      - name: Install the packaging tools
        run: scripts/ci/cross.sh packaging_tools
      - name: Install the build tools
        run: scripts/ci/cross.sh build_tools
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: docker exec build pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pacman
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      - name: Install the target's libraries
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: scripts/ci/cross.sh sysroot_libraries
      - if: steps.sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: sysroot
          key: ${{ steps.sysroot.outputs.cache-primary-key }}
      - name: Name the LLVM version
        id: llvm
        run: echo "version=$(docker exec build llvm-config --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: llvm-cache
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: linux-llvm-cross-${{ matrix.arch }}-${{ hashFiles('scripts/linux-llvm.sh', 'scripts/llvm-libraries/CMakeLists.txt', 'cmake/llvm_components.cmake') }}-${{ steps.llvm.outputs.version }}
      - name: Cross-build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          LLVM_VERSION: ${{ steps.llvm.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: scripts/ci/cross.sh llvm
      - *llvm-save
      - name: Name the compiles' start
        id: compiles
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Cross-build and install
        env:
          PRESET: ${{ matrix.preset }}
          ARCH: ${{ matrix.arch }}
        run: scripts/ci/cross.sh build
      - name: Run the A64 differential against the recorded QEMU reference
        if: env.SNX_TESTS == 'true' && needs.qemu-reference.result == 'success'
        env:
          PRESET: ${{ matrix.preset }}
          ARCH: ${{ matrix.arch }}
          QEMU: ${{ matrix.qemu }}
        run: scripts/ci/cross.sh differential
      - name: Run the launcher's tests through qemu
        if: env.SNX_TESTS == 'true'
        env:
          PRESET: ${{ matrix.preset }}
          ARCH: ${{ matrix.arch }}
        run: scripts/ci/cross.sh launcher_tests
      - name: Recompile whole programs through qemu
        if: env.SNX_TESTS == 'true'
        env:
          PRESET: ${{ matrix.preset }}
        run: scripts/ci/cross.sh census
      - name: Keep what this run compiled
        env:
          START: ${{ steps.compiles.outputs.start }}
        run: scripts/ci/cross.sh ccache_trim
      - *ccache-save-arch
      - *deps-name
      - *deps-save
      - name: Bundle the AppImage
        run: scripts/ci/cross.sh bundle
      - name: Make the AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/ci/cross.sh appimage
      - name: Check the AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/ci/cross.sh check_appimage
      - *appimage-upload
      - name: Give the dependency sources back to the runner
        run: scripts/ci/cross.sh cpm_owner
      - name: Run ${{ matrix.arch }} AppImages through qemu-user
        if: env.SNX_TESTS == 'true'
        env:
          QEMU: ${{ matrix.qemu }}
        run: scripts/ci/cross.sh binfmt
      - name: Run the AppImage as a user would
        if: env.SNX_TESTS == 'true'
        env:
          QEMU: ${{ matrix.qemu }}
          ARCH: ${{ matrix.arch }}
        run: scripts/ci/cross.sh run_appimage
  # x86-64 and AArch64 (MSYS2's CLANGARM64); the x86-64 leg keeps the name the branch rules require
  windows:
    name: Windows (Clang + LLVM${{ matrix.arch == 'aarch64' && ', aarch64' || '' }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-2025-vs2026' }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - *commit
      - uses: actions/checkout@v7
      - name: Cancel the run when another job fails
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fail-fast.py start
      # MSYS2's git reads no core.autocrlf of Git for Windows: without this every file reads changed, the build -dirty
      - name: Keep the checkout's line ends for MSYS2's git
        shell: bash
        run: git config --local core.autocrlf "$(git config core.autocrlf || echo false)"
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-windows-${{ matrix.arch }}-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-windows-${{ matrix.arch }}-
      - *ccache-restore-arch
      - *deps-restore
      - *caches-env
      - name: Install Clang, LLVM development files and FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.arch == 'aarch64' && 'CLANGARM64' || 'CLANG64' }}
          update: true
          path-type: strict
          install: >-
            git make patch perl patchutils mingw-w64-clang-${{ matrix.arch }}-glslang
            mingw-w64-clang-${{ matrix.arch }}-clang mingw-w64-clang-${{ matrix.arch }}-llvm
            mingw-w64-clang-${{ matrix.arch }}-lld mingw-w64-clang-${{ matrix.arch }}-cmake
            mingw-w64-clang-${{ matrix.arch }}-ninja mingw-w64-clang-${{ matrix.arch }}-meson
            mingw-w64-clang-${{ matrix.arch }}-nasm mingw-w64-clang-${{ matrix.arch }}-pkgconf
            mingw-w64-clang-${{ matrix.arch }}-python mingw-w64-clang-${{ matrix.arch }}-ccache
      - name: Check required dependencies
        run: bash scripts/ci/windows.sh dependencies
      - name: Build the runtime and pinned dependencies
        env:
          JDK_ARCH: ${{ matrix.arch == 'aarch64' && 'AARCH64' || 'X64' }}
          LTO: ${{ github.event_name != 'pull_request' && 'ON' || 'OFF' }}
        run: bash scripts/ci/windows.sh build
      - name: Check the build line names the checkout as it is
        run: bash scripts/ci/windows.sh build_line
      - &ccache-trim-show
        name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - *ccache-save-arch
      - *deps-name
      - *deps-save
      - name: Check the executables' icon and manifest
        run: bash scripts/ci/windows.sh resources
      - name: Check the native driver
        run: bash scripts/ci/windows.sh driver
      - name: Test native tooling and indexed filesystems
        if: env.SNX_TESTS == 'true'
        run: bash scripts/ci/windows.sh tests
      - name: Bundle runtime DLLs and licenses
        run: bash scripts/ci/windows.sh bundle
      - name: Check the artifact without the toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$(Resolve-Path stage/bin);$env:SystemRoot\System32;$env:SystemRoot"
          & .\stage\bin\scarletnx.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-windows-${{ matrix.arch }}-${{ steps.commit.outputs.short }}
          path: stage
          if-no-files-found: error
      # in Git Bash, where no DLL of MSYS2's stands in for one the zip lacks
      - name: Run the zip's scarletnx.exe as a user would
        shell: bash
        run: bash scripts/check-package.sh stage/bin/scarletnx.exe
      - *fail-fast-file
      - *fail-fast-mark

  # The Android app (docs/hosts/android-app.md): each ABI's APK, then one of both. LLVM's libraries for an ABI take
  # most of an hour, kept until the script that builds them changes
  android:
    name: Android APK
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - *commit
      - uses: actions/checkout@v7
      - *fail-fast-watch
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-android-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-android-
      - uses: actions/cache/restore@v5
        id: llvm-x86_64
        with:
          path: android-llvm/x86_64
          key: android-llvm-x86_64-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      - uses: actions/cache/restore@v5
        id: llvm-arm64
        with:
          path: android-llvm/arm64-v8a
          key: android-llvm-arm64-v8a-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      - name: Install the NDK, NASM and meson
        run: scripts/ci/android.sh tools
      - name: Build LLVM's libraries for x86_64
        if: steps.llvm-x86_64.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh x86_64 "$PWD/android-llvm/x86_64"
      - if: steps.llvm-x86_64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: android-llvm/x86_64
          key: ${{ steps.llvm-x86_64.outputs.cache-primary-key }}
      - name: Build LLVM's libraries for arm64-v8a
        if: steps.llvm-arm64.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh arm64-v8a "$PWD/android-llvm/arm64-v8a"
      - if: steps.llvm-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: android-llvm/arm64-v8a
          key: ${{ steps.llvm-arm64.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      # Gradle's plugins, fetched from Maven Central otherwise on every cold run
      - uses: actions/cache@v5
        with:
          path: .cache/gradle/caches
          key: gradle-android-${{ hashFiles('dist/android/**') }}
          restore-keys: gradle-android-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            # the NDK is installed afresh on each run: its version, not its files' dates, says which compiler it is
            echo "CCACHE_COMPILERCHECK=string:$ANDROID_NDK_ROOT"
            echo "GRADLE_USER_HOME=$ws/.cache/gradle"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: scripts/ci/android.sh keystore
      - name: Build each ABI's native libraries and APK
        env:
          SHORT: ${{ steps.commit.outputs.short }}
          SNX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: scripts/ci/android.sh build
      - *ccache-trim-show
      - *ccache-save
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - *deps-save
      - name: Pack the APK of both ABIs
        env:
          SHORT: ${{ steps.commit.outputs.short }}
          SNX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: scripts/ci/android.sh pack
      - name: Check the APK's signer
        env:
          SHORT: ${{ steps.commit.outputs.short }}
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: scripts/ci/android.sh signer
      - name: Check the APK's libraries
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: scripts/ci/android.sh libraries
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-x86_64-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-arm64-v8a-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      # Robolectric fetches the Android it runs the tests on (android-all-instrumented) from Maven Central as they start, into
      # ~/.m2, not Gradle's cache: kept between runs, as Maven Central refuses a cold run's fetch at times (HTTP 429)
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('dist/android/build.gradle') }}
          restore-keys: robolectric-
      - name: Test the app's Java
        if: env.SNX_TESTS == 'true'
        run: JAVA_HOME=$JAVA_HOME_21_X64 gradle -p dist/android testDebugUnitTest -Pscarletnx.stage="$PWD/stage"
      - *fail-fast-file
      - *fail-fast-mark

  # macOS and iOS (docs/hosts/apple.md) on one Apple silicon runner. A failure does not fail the run
  # (continue-on-error); iOS builds even when macOS failed. Each app carries Ryujinx's MoltenVK
  # (V380-Ori/Ryujinx.MoltenVK), its release's tars by the SHA-256 GitHub lists
  apple:
    name: macOS and iOS (arm64)
    runs-on: macos-26
    timeout-minutes: 240
    continue-on-error: true
    env:
      MOLTENVK_RELEASE: v1.4.1-ryujinx
      MOLTENVK_MACOS_SHA256: ea1c633808d0a61e86ee35af4bdc280f5f07f95633b95935f3e695dc5226e640
      MOLTENVK_IOS_SHA256: 7cec48d4e73cf9eb89b60e8596758900caaf8398c49ae8abe4544295fb7e0c84
    steps:
      - *commit
      - uses: actions/checkout@v7
      - *fail-fast-watch
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpmutil-apple-${{ hashFiles('cpmfile.json', '.patch/**') }}
          restore-keys: cpmutil-apple-
      # LLVM's libraries for each (scripts/apple-llvm.sh), saved as soon as built: a later failure keeps them
      - name: Name the Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: macos-llvm
        with:
          path: apple-llvm
          key: macos-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      - uses: actions/cache/restore@v5
        id: ios-llvm
        with:
          path: ios-llvm
          key: ios-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Install tools
        run: brew install ninja meson ccache
      - name: Build LLVM's libraries for macOS
        id: macos-llvm-build
        if: steps.macos-llvm.outputs.cache-hit != 'true'
        run: scripts/apple-llvm.sh macos "$PWD/apple-llvm"
      - if: steps.macos-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: apple-llvm
          key: ${{ steps.macos-llvm.outputs.cache-primary-key }}
      - name: Build LLVM's libraries for iOS
        id: ios-llvm-build
        if: ${{ !cancelled() && steps.ios-llvm.outputs.cache-hit != 'true' }}
        run: scripts/apple-llvm.sh ios "$PWD/ios-llvm"
      - if: ${{ !cancelled() && steps.ios-llvm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ios-llvm
          key: ${{ steps.ios-llvm.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v5
        if: ${{ !cancelled() }}
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - uses: actions/cache/restore@v5
        if: ${{ !cancelled() }}
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        if: ${{ !cancelled() }}
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$GITHUB_WORKSPACE/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build the runtime for macOS
        id: macos-build
        if: ${{ !cancelled() && steps.macos-llvm-build.outcome != 'failure' }}
        run: scripts/ci/apple.sh macos_build
      - name: Build the app for iOS
        id: ios-build
        if: ${{ !cancelled() && steps.ios-llvm-build.outcome != 'failure' }}
        run: scripts/ci/apple.sh ios_build
      - name: Trim the compiler cache
        if: ${{ !cancelled() }}
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        if: ${{ !cancelled() }}
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(shasum -a 256 <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key }}
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      - name: Check the ABI helpers compile
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        run: clang -std=gnu23 -fsyntax-only -Wall -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' && env.SNX_TESTS == 'true' }}
        run: scripts/ci/apple.sh tests
      - name: Build the platform tests against a shared SDL3
        if: ${{ !cancelled() && steps.macos-llvm-build.outcome != 'failure' }}
        run: scripts/ci/apple.sh shared_sdl3
      - name: Make the macOS app
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: scripts/ci/apple.sh macos_app
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        with:
          path: ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}.zip
          archive: false
          if-no-files-found: error
      - name: Make the IPA
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: scripts/ci/apple.sh ipa
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        with:
          path: ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}.ipa
          archive: false
          if-no-files-found: error
