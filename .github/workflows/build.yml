name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # a version's release (publish.yml)
  pull_request:
    # skipped when the change is only in files that no build or test reads. tracked_material.py reads them all and runs
    # on its own (pr-checks.yml). docs/ARCHITECTURE.md, DEPRECATIONS.md and GUI.md are test inputs: they build
    paths:
      - '**'
      - '!**/*.md'
      - '!.claude/**'
      - '!.gitignore'
      - '!.github/ISSUE_TEMPLATE/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/DEPRECATIONS.md'
      - 'docs/GUI.md'
  workflow_dispatch:

# Jobs only read the repository. A push to main that builds everywhere becomes a nightly, and a pull request's run a
# prerelease, in scarletnx/nightly: publish.yml does it once this workflow ends
permissions:
  contents: read

# a push to a pull request cancels that pull request's build still running: only its newest commit is built. main and
# the tags build every commit
concurrency:
  group: >-
    build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Linux jobs run in Arch Linux, which has the same Clang 23 and clang-format 23 as development, and its LLVM 23 for the
# recompiler's code generator (required, cmake/llvm.cmake). Windows uses MSYS2 CLANG64 so Clang, the MinGW/UCRT runtime
# and LLVM's development libraries come from one compatible toolchain. FFmpeg, OpenSSL, Vulkan and SDL3 are built from
# the pinned CPM sources, with MSYS2 providing the shell, GNU make and NASM needed by FFmpeg and the Perl OpenSSL's
# Configure runs on. Downloads are cached in .cache/cpm, one cache per job since each job fetches a different set.
# Compiles go through ccache, whose .cache/ccache each compiling job restores from its newest run and saves trimmed to
# what the run used. The artifacts are what `cmake --install` puts in place: the binaries with the licenses that go
# with them.
jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            container: archlinux:latest
          # Arch's image is x86-64 only; pkgforge's (the AppImage's) is Arch Linux ARM on AArch64, with the same LLVM
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # pacman's packages, which it takes before its mirrors: this week's cache, else last week's. linux-sanitizers
      # shares x86-64's, the same image and list
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-linux-${{ matrix.arch }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-linux-${{ matrix.arch }}-
      # llvm: llvm-config and LLVM-C for the recompiler (llvm-libs alone has no headers). gdb: the gdbserver gdbstub_native drives. jq: scripts/pr-builds.sh, which pr_builds tests. Mirrors drop a connection now
      # and then (pkgforge's for aarch64 most), so each pacman install is tried 3 times, 5 s apart
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja make patch nasm perl python git clang lld llvm qemu-user pkgconf sdl3 libxtst libxrandr libxss vulkan-swrast vulkan-validation-layers ccache gdb jq glslang && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # Saved once a week, by its first run: what it installed, without the versions nothing installs any more. The
      # other runs of the week download only what changed since
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      # two commits: a pull request's merge commit and the base it is diffed against below
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request is measured against the baseline main has, never the copy it carries: it may tighten its own
      # numbers only through the reviewed baseline file on main
      - name: Use main's performance baseline
        if: github.event_name == 'pull_request'
        run: |
          if git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 origin "${{ github.base_ref }}" &&
             git -c safe.directory="$GITHUB_WORKSPACE" show \
               "origin/${{ github.base_ref }}:tests/perf_baseline.txt" > "$RUNNER_TEMP/perf_baseline.txt"; then
            echo "SNX_PERF_BASELINE=$RUNNER_TEMP/perf_baseline.txt" >> "$GITHUB_ENV"
          else
            echo "::warning title=perf::main has no performance baseline yet; the checked-out file is used"
          fi
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # ccache under every compile, FFmpeg's and OpenSSL's too, from the newest cache of this job on this branch, else
      # on main. Each cmake gets it as its launcher: from the environment CMake would run its configure checks through
      # it, and they only miss
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      # FFmpeg's and OpenSSL's builds (cmake/deps_cache.cmake), from the newest cache of this job on this branch, else
      # on main. The key named here is never saved: a run saves its own below, named after the builds it used
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            # paths in the keys relative to the checkout, and no build folder in them: build trees share entries
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # Unicorn 2.1.4, the A32 and Thumb differentials' reference (SNX_TEST_ARM_DIFF), in a venv: Arch's Python takes no
      # pip install of its own. PyPI drops a connection now and then, so it is tried 3 times, 5 s apart
      - name: Install Unicorn
        run: |
          python -m venv --system-site-packages .cache/unicorn
          for try in 1 2 3; do
            .cache/unicorn/bin/pip install --quiet unicorn==2.1.4 && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - name: Build the runtime
        run: |
          cmake --preset default -DSNX_TEST_VP9_VECTORS=ON -DSNX_TEST_ARM_DIFF=ON \
            -DPython3_EXECUTABLE="$PWD/.cache/unicorn/bin/python" -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default --prefix stage
      # The fallback is CMake's (cmake/dependencies.cmake pins SDL3) and the Windows job builds the same SDL3 from
      # source: a pull request that changes no CMake file and not this workflow skips it, a push always builds it
      - name: Look for CMake changes
        id: cmake-changed
        if: github.event_name == 'pull_request'
        run: |
          # safe.directory for this command only: the container's git refuses the checkout, and the build
          # (cmake/commit.cmake) and build_info_commit after it must see it the same way
          changed=$(git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          if grep -qE '(^|/)CMakeLists\.txt$|\.cmake$|^CMakePresets\.json$|^\.github/workflows/build\.yml$' <<<"$changed"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the SDL3 fallback without a system package
        if: github.event_name != 'pull_request' || steps.cmake-changed.outputs.yes == 'true'
        run: |
          cmake --preset default -B build/sdl-fallback -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON \
            -DSNX_DEPLOY=OFF -DBUILD_TESTING=OFF -DSDL_WAYLAND=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/sdl-fallback --target scarletnx --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Build SDL3 with headless Vulkan tests
        run: |
          cmake --preset default -B build/headless -DSNX_BUILD_GUI=OFF -DSNX_DEPLOY=OFF -DSNX_TEST_VULKAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/headless --parallel "$(getconf _NPROCESSORS_ONLN)"
      # Only what this run used is kept, so the cache saved is one build's worth
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the dependency builds this run's trees used stay, under a key named after them: saved when they changed
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      - name: Test headless Vulkan and NX runtime
        run: ctest --test-dir build/headless -R '^(vulkan_headless|vulkan_headless_vic_validation|nx_runtime_homebrew|nx_runtime_homebrew_64k_pages)$' --output-on-failure
      # The game modules compile src/common/cpu/aarch64/cpu_helpers.c, which no CMake target does
      - name: Check the ABI helpers compile
        run: clang -fsyntax-only -Wall -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        run: ctest --test-dir build/default --output-on-failure --parallel 4 --exclude-regex '^perf_(cpu|gpu|compile)$'
      # One step for all three: no other test runs beside them, the output is the step's so GitHub parses its
      # ::warning:: and ::error:: annotations, and the step's two minute cap bounds the whole performance suite
      - name: Performance regression tests
        timeout-minutes: 2
        env:
          SNX_PERF_REQUIRE: "1"
        run: |
          set -euo pipefail
          baseline="${SNX_PERF_BASELINE:-tests/perf_baseline.txt}"
          SNX_PERF_RESULT="$GITHUB_WORKSPACE/perf-result-cpu-${{ matrix.arch }}.txt" \
            build/default/tests/snx-test-perf-cpu "$baseline"
          SNX_PERF_RESULT="$GITHUB_WORKSPACE/perf-result-compile-${{ matrix.arch }}.txt" \
            python3 tests/perf_compile.py --runtime build/default/scarletnx --repo "$PWD" --baseline "$baseline"
          SNX_PERF_RESULT="$GITHUB_WORKSPACE/perf-result-gpu-${{ matrix.arch }}.txt" \
            build/headless/src/nx/snx-test-perf-gpu "$baseline"
      # Main proposes the next baseline from its own run: a reference moves down only when the whole 95% interval
      # is below it, so a small regression passes inside the band but never moves the line. The file is an artifact
      # and a summary diff, for a reviewed commit (a bot pull request can apply it later)
      - name: Propose the performance baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/perf-baseline.py --baseline tests/perf_baseline.txt \
            --result "perf-result-cpu-${{ matrix.arch }}.txt" \
            --result "perf-result-gpu-${{ matrix.arch }}.txt" \
            --result "perf-result-compile-${{ matrix.arch }}.txt" \
            --out "perf-baseline-${{ matrix.arch }}.txt"
          {
            echo "### Performance baseline (${{ matrix.arch }})"
            echo '```diff'
            diff -u tests/perf_baseline.txt "perf-baseline-${{ matrix.arch }}.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the proposed baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: perf-baseline-${{ matrix.arch }}-${{ steps.commit.outputs.short }}
          path: "perf-baseline-${{ matrix.arch }}.txt"
      - name: Check optional Python diagnostics
        run: |
          python -m compileall -q tools
          python tools/run_game.py --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}-install
          path: stage

  # x86-64 with ASan and UBSan (SNX_TEST_SANITIZERS): every test, and the programs and libraries of ours it runs or
  # links, built with them (runtime_architecture names any left out), so our code reading memory after it was freed or
  # past its end fails on every run, not only where it happens to crash. A report stops the program that made it, a
  # code generator of the build or a test, and fails the job, printed whole. Its own compiler cache; the linux job's
  # CPM sources and FFmpeg and OpenSSL builds, which the sanitizers leave as they are, are read and never saved here
  linux-sanitizers:
    name: Linux (x86_64, ASan + UBSan)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: archlinux:latest
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # a block only a stale stack slot or register still points at is a leak, on every machine alike: with them
      # read, what a leak check finds depends on what the stack happened to hold at exit
      LSAN_OPTIONS: use_stacks=0:use_registers=0
    steps:
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # pacman's packages, which it takes before its mirrors: this week's cache, else last week's. The linux job's on
      # x86-64, the same image and list
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-linux-x86_64-${{ steps.week.outputs.week }}
          restore-keys: pacman-linux-x86_64-
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja make patch nasm perl python git clang lld llvm qemu-user pkgconf sdl3 libxtst libxrandr libxss vulkan-swrast vulkan-validation-layers ccache gdb jq glslang && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # Saved once a week, by its first run: what it installed, without the versions nothing installs any more. The
      # other runs of the week download only what changed since
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-linux-x86_64-${{ hashFiles('cmake/dependencies.cmake') }}
      - uses: actions/cache/restore@v5
        with:
          path: .cache/deps
          key: deps-linux-x86_64-${{ github.run_id }}
          restore-keys: deps-linux-x86_64-
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build with the sanitizers
        run: |
          cmake --preset default -B build/sanitizers -DSNX_TEST_SANITIZERS=ON -DSNX_TEST_VP9_VECTORS=ON \
            -DSNX_DEPLOY=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/sanitizers --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test under the sanitizers
        run: ctest --test-dir build/sanitizers --output-on-failure --parallel 4

