  # Big-endian ppc64 (ELFv1, Debian ports' glibc), cross-built as the ppc64le job above would be and tested under
  # qemu-ppc64: the Linux runtime only (the Switch runtime is ported to big-endian ELFv2, which appimage-cross builds),
  # so no package. Debian ports' unstable is the system root, which can break for a day, so like the cross-built AppImages
  # it may fail without failing the run. Its card field says what the tests did (ReiWimsy's CHECKS, in
  # scarletnx/discord-bots)
  linux-ppc64:
    name: Linux (ppc64, cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    # privileged for the binfmt handler below
    container:
      image: debian:trixie
      options: --privileged
    env:
      SNX_SYSROOT: ${{ github.workspace }}/.cache/sysroot-ppc64
    steps:
      # the build machine's tools, as the ppc64le job's, with GNU ld for ELFv1 (LLD links none), the ports archive's
      # keys for the sysroot, and qemu-user-binfmt's handler for the next step
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git clang lld llvm cmake ninja-build make perl \
            python3 ccache mmdebstrap qemu-user qemu-user-binfmt glslang-tools spirv-tools pkgconf xz-utils zstd \
            binutils-powerpc64-linux-gnu debian-ports-archive-keyring
      # gnuabi_process runs the runtime as a program, and the runtime starts programs of its own: the kernel runs
      # them through qemu-ppc64 by Debian's handler, which no systemd registers in the container. F opens qemu now,
      # so the handler works in any mount namespace, and the kernel's one table is the runner's
      - name: Register qemu-ppc64 for ppc64 programs
        run: |
          mountpoint -q /proc/sys/fs/binfmt_misc || mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          [ ! -e /proc/sys/fs/binfmt_misc/qemu-ppc64 ] || echo -1 > /proc/sys/fs/binfmt_misc/qemu-ppc64
          cat /usr/lib/binfmt.d/qemu-ppc64.conf > /proc/sys/fs/binfmt_misc/register
          cat /proc/sys/fs/binfmt_misc/qemu-ppc64
      - uses: actions/checkout@v7
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: sysroot
        with:
          path: .cache/sysroot-ppc64
          key: sysroot-ppc64-${{ hashFiles('scripts/ppc64-sysroot.sh') }}-${{ steps.week.outputs.week }}
      - name: Make the sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: scripts/ppc64-sysroot.sh ppc64 .cache/sysroot-ppc64
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        shell: bash
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$GITHUB_WORKSPACE/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # the Linux runtime (scarletnx with the GNU ABI driver alone, scarletnx-gnuabi a link to it) and the programs of
      # the tests below, no more: the services' tests are configured even without the Switch runtime, and need its
      # libraries
      - name: Build
        run: |
          cmake --preset linux-ppc64-cross -DSNX_OPT_FLAGS="-O2 -g0" \
            -DSNX_BUILD_NX=OFF -DSNX_BUILD_3DS=OFF -DSNX_BUILD_VITA=OFF -DSNX_BUILD_AGB=OFF -DSNX_BUILD_GUI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset linux-ppc64-cross --parallel "$(getconf _NPROCESSORS_ONLN)" \
            --target scarletnx snx-test-cas128 snx-test-endian snx-test-gnuabi-runtime snx-test-gnuabi-vfs \
            snx-test-gnuabi-hostfs snx-test-gnuabi-network
      - name: Trim the compiler cache
        shell: bash
        run: |
          ccache --show-stats
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        shell: bash
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # what the big-endian port covers, through qemu-ppc64 (the preset's emulator): the Linux runtime's tests, the
      # byte order helpers and the 128-bit compare-and-swap. The services' tests read guest memory as host numbers,
      # which only a little-endian host does
      - name: Test under qemu-user
        run: >-
          ctest --preset linux-ppc64-cross --parallel "$(getconf _NPROCESSORS_ONLN)"
          --tests-regex '^(gnuabi_|endian$|cas128$)'

  appimage:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # LLVM's build (scripts/linux-llvm.sh) adds about half an hour where its cache misses
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # pkgforge's Arch image and tools (https://github.com/pkgforge-dev/Anylinux-AppImages), see scripts/make-appimage.sh
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # pacman's packages, which it takes before its mirrors: this week's cache, else last week's
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: /var/cache/pacman/pkg
          key: pacman-appimage-${{ matrix.arch }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-appimage-${{ matrix.arch }}-
      # Before the checkout: without git, actions/checkout downloads the files without the history, and the AppImage's
      # version (git describe) is unknown. Each pacman install is tried 3 times, as in the linux job
      - name: Install git
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed git && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # ccache, set up as in the linux job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      # the dependency builds, as in the linux job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # The action pins its own setup script only: the tools that script downloads are pinned here to a commit of
      # Anylinux-AppImages, and checked against their SHA-256 below
      - name: Install the packaging tools
        uses: pkgforge-dev/anylinux-setup-action@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/make-aur-package.sh
      - name: Check the packaging tools
        run: |
          sha256sum -c <<'EOF'
          4ce6946b8d6c9d0f472d41ad533e920132de66ec58d1e3445ea4f1d27376eec7  /usr/local/bin/quick-sharun
          c8880a7e2f0a47b68ed5ae34e1b7aeecc2e5b3a55f3583b0b43d9818a15dbe8b  /usr/local/bin/get-debloated-pkgs
          86afbf5045b78020c93fcd35bf0f642765a8dc339bb2dce534a0461ce3d3508d  /usr/local/bin/make-aur-package
          EOF
      # llvm: Clang's own, and the opt of the LLVM settings; the runtime links LLVM's libraries statically (below)
      - name: Install the build tools and the debloated Mesa
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja make patch nasm perl python clang llvm sdl3 libx11 mesa vulkan-icd-loader ccache glslang && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          get-debloated-pkgs mesa-nano opus-mini icu-mini
      # Saved once a week, by its first run: what it installed, without the versions nothing installs any more. The
      # other runs of the week download only what changed since
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      # LLVM's libraries linked into the runtime, with the host's code generator alone (scripts/linux-llvm.sh), where
      # Arch's libLLVM is one library with every target. Built once for each version, the image's LLVM's,
      # whose opt prints the pipelines of the LLVM settings (cmake/settings.cmake)
      - name: Name the LLVM version
        id: llvm
        run: echo "version=$(llvm-config --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: llvm-cache
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: linux-llvm-${{ matrix.arch }}-${{ hashFiles('scripts/linux-llvm.sh', 'scripts/llvm-libraries/CMakeLists.txt', 'cmake/llvm_components.cmake') }}-${{ steps.llvm.outputs.version }}
      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          LLVM_VERSION: ${{ steps.llvm.outputs.version }}
        run: scripts/linux-llvm.sh ${{ matrix.arch }} "$PWD/.cache/llvm/${{ matrix.arch }}"
      # A release leaves out scarletnx --mcp's A64 disassembler (SNX_A64_DISASM), which is for working on the runtime
      - name: Build and install into /usr
        run: |
          git config --global --add safe.directory '*'
          cmake --preset default -DSNX_DEPLOY=OFF -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLVM_DIR="$PWD/.cache/llvm/${{ matrix.arch }}/lib/cmake/llvm" -DSNX_A64_DISASM=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # The script names the AppImage after `git describe`
      - name: Make the AppImage
        run: scripts/make-appimage.sh
      # Only what the script made: dist/ also holds the tracked desktop entry and icon
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: |
            dist/*.AppImage*
            dist/appinfo

  # The AppImages of hosts no GitHub runner is: cross-built on x86-64 with their linux-<arch>-cross preset
  # (cmake/cross.cmake) against the system root of pkgforge's Arch image of the architecture, then bundled in a
  # container of that image, whose / holds the runtime, and made on the build machine. The build container is
  # pkgforge's x86-64 image with the workspace at /src; platform is Docker's name of the architecture (loong64 for
  # LoongArch). Big-endian ppc64's has every runtime (the 3DS one builds there but isn't ported to a big-endian host):
  # Arch POWER's glibc there is ELFv2, not Debian ports' ELFv1, which the linux-ppc64 job tests. No POWER, RISC-V or
  # LoongArch machine has run the AppImages yet, so like the macOS and iOS jobs they may fail without failing the run
  # (scripts/publish-builds.py, OPTIONAL)
  appimage-cross:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    # LLVM's cross build (scripts/linux-llvm.sh) adds about half an hour where its cache misses
    timeout-minutes: 180
    continue-on-error: true
    env:
      QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/quick-sharun.sh
      QUICK_SHARUN_SHA: 4ce6946b8d6c9d0f472d41ad533e920132de66ec58d1e3445ea4f1d27376eec7
      APPIMAGETOOL_URL: https://github.com/pkgforge-dev/appimagetool/releases/download/0.5.3/appimagetool-full-x86_64-linux
      APPIMAGETOOL_SHA: 9a6fd46ee6bc5910e7acfa68f9d8090f3751e956840b90304ef57d64321a530d
      DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c28bb80743106fdf08cb10fb27d19d9932eb0865/useful-tools/get-debloated-pkgs.sh
      DEBLOATED_PACKAGES_SHA: c8880a7e2f0a47b68ed5ae34e1b7aeecc2e5b3a55f3583b0b43d9818a15dbe8b
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ppc64le
            platform: ppc64le
            preset: linux-ppc64le-cross
          - arch: riscv64
            platform: riscv64
            preset: linux-riscv64-cross
          - arch: loongarch64
            platform: loong64
            preset: linux-loongarch64-cross
          - arch: ppc64
            platform: ppc64
            preset: linux-ppc64-elfv2-cross
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # ccache and the dependency builds, as in the linux job. The container builds as root: what it makes in them
      # goes back to the runner's user before each is saved
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      # The script's checks run the AppImage it made: the kernel runs the target's programs through qemu once their
      # binfmt handlers are registered, in the container too
      - name: Set up qemu emulation for ${{ matrix.arch }}
        if: matrix.platform != 'ppc64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}
      # tonistiigi/binfmt, which setup-qemu-action registers, has no big-endian ppc64: the runner's qemu-user runs its
      # programs instead, by the magic and mask Debian's qemu-user-binfmt gives them (its qemu-ppc64.conf). F opens
      # qemu now, so the containers use it too, and P keeps argv[0], as qemu reads from the kernel since 9.0
      - name: Set up qemu emulation for ppc64
        if: matrix.platform == 'ppc64'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
          # the build container has none of the runner's libraries: its qemu has to be static, as Debian's is since 9.2
          ! ldd "$(command -v qemu-ppc64)" 2>&1 | grep -q '=>' ||
            { echo "the runner's qemu-ppc64 is dynamically linked, which the build container cannot run" >&2; exit 1; }
          printf ':qemu-ppc64:M::%s:%s:%s:POCF\n' \
            '\x7f\x45\x4c\x46\x02\x02\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x15' \
            '\xff\xff\xff\xff\xff\xff\xff\xfc\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff' \
            "$(command -v qemu-ppc64)" | sudo tee /proc/sys/fs/binfmt_misc/register
          head -n 3 /proc/sys/fs/binfmt_misc/qemu-ppc64
      # The system root with the target's libraries installed (scripts/appimage-sysroot.sh), made again each week and
      # whenever the script changes: Arch moves on, and the root's packages with it
      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: sysroot
        with:
          path: sysroot
          key: sysroot-${{ matrix.arch }}-${{ hashFiles('scripts/appimage-sysroot.sh') }}-${{ steps.week.outputs.week }}
      # The build container's packages of this week's cache, else last week's, which pacman takes before its mirrors:
      # mounted as its package cache
      - uses: actions/cache/restore@v5
        id: pacman
        with:
          path: ${{ runner.temp }}/pacman
          key: pacman-${{ github.job }}-${{ steps.week.outputs.week }}
          restore-keys: pacman-${{ github.job }}-
      # The target container is where the packages and then the runtime go: / is the image, so pacman, quick-sharun
      # and get-debloated-pkgs work unmodified
      - name: Start the build and target containers
        run: |
          mkdir -p "$RUNNER_TEMP/pacman"
          docker run --detach --name build --volume "$PWD:/src" --volume "$RUNNER_TEMP/pacman:/var/cache/pacman/pkg" \
            --workdir /src ghcr.io/pkgforge-dev/archlinux:latest sleep infinity
          docker run --detach --name target --platform linux/${{ matrix.platform }} \
            --volume "$PWD:/src" --workdir /src ghcr.io/pkgforge-dev/archlinux:latest sleep infinity
      - name: Unpack the ${{ matrix.arch }} system root
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          image=ghcr.io/pkgforge-dev/archlinux:latest
          docker pull --platform linux/${{ matrix.platform }} "$image"
          docker exec build mkdir -p /src/sysroot
          docker export "$(docker create --platform linux/${{ matrix.platform }} "$image")" | docker exec -i build tar -x -C /src/sysroot
      # The pinned Anylinux-AppImages tools and the target's libraries the runtime links and bundles: binutils and
      # patchelf are what quick-sharun needs on PATH. get-debloated-pkgs then replaces the full Mesa (its libgallium
      # links libLLVM), ICU and Opus, so it runs last. Each pacman is tried 3 times, as in the linux job
      - name: Install the target container's tools and libraries
        env:
          LINUX_ONLY: ${{ matrix.linux-only && '1' || '' }}
        run: |
          docker exec -i -e QUICK_SHARUN -e QUICK_SHARUN_SHA -e DEBLOATED_PACKAGES -e DEBLOATED_PACKAGES_SHA \
            -e LINUX_ONLY target sh -s <<'EOF'
          set -eu
          libraries="patchelf binutils"
          [ -n "$LINUX_ONLY" ] || libraries="$libraries libx11 mesa vulkan-icd-loader vulkan-radeon vulkan-swrast
            libxext libxcursor libxfixes libxi libxinerama libxrandr libxrender libxss libxtst libxkbcommon wayland
            wayland-protocols libdecor alsa-lib libpulse libpipewire hidapi libusb"
          retry() { for try in 1 2 3; do "$@" && return; [ "$try" = 3 ] && return 1; sleep 5; done; }
          retry pacman -Syu --noconfirm --needed $libraries
          curl -fsSL --retry 3 -o /usr/local/bin/quick-sharun "$QUICK_SHARUN"
          curl -fsSL --retry 3 -o /usr/local/bin/get-debloated-pkgs "$DEBLOATED_PACKAGES"
          chmod +x /usr/local/bin/quick-sharun /usr/local/bin/get-debloated-pkgs
          printf '%s  %s\n' "$QUICK_SHARUN_SHA" /usr/local/bin/quick-sharun \
                           "$DEBLOATED_PACKAGES_SHA" /usr/local/bin/get-debloated-pkgs | sha256sum -c
          debloated="opus-mini icu-mini"
          [ -n "$LINUX_ONLY" ] || debloated="mesa-nano $debloated"
          get-debloated-pkgs $debloated
          EOF
      # The build machine's packaging tool: quick-sharun makes the AppImage, and this appimagetool compresses natively
      # and takes the target's runtime from APPIMAGE_ARCH
      - name: Install the packaging tools
        run: |
          docker exec -i -e QUICK_SHARUN -e QUICK_SHARUN_SHA -e APPIMAGETOOL_URL -e APPIMAGETOOL_SHA build sh -s <<'EOF'
          set -eu
          curl -fsSL --retry 3 -o /usr/local/bin/quick-sharun "$QUICK_SHARUN"
          curl -fsSL --retry 3 -o /usr/local/bin/appimagetool "$APPIMAGETOOL_URL"
          chmod +x /usr/local/bin/quick-sharun /usr/local/bin/appimagetool
          printf '%s  %s\n' "$QUICK_SHARUN_SHA" /usr/local/bin/quick-sharun \
                           "$APPIMAGETOOL_SHA" /usr/local/bin/appimagetool | sha256sum -c
          EOF
      # appimagetool takes a mkdwarfs on PATH before the target's it would fetch, and qemu runs that one: this is the
      # x86-64 build of the DwarFS release appimagetool pins, checked against the SHA-256 it pins
      - name: Install this machine's mkdwarfs
        env:
          MKDWARFS: https://github.com/mhx/dwarfs/releases/download/v0.15.6/dwarfs-universal-0.15.6-Linux-x86_64
        run: |
          docker exec -i -e MKDWARFS build sh -s <<'EOF'
          set -eu
          curl -fsSL --retry 3 -o /usr/local/bin/dwarfs-universal "$MKDWARFS"
          echo '50891c38ba359db8271819a6cbf6aaa8068681523f0c4f2b8242007a45edaa28  /usr/local/bin/dwarfs-universal' |
            sha256sum -c
          chmod +x /usr/local/bin/dwarfs-universal
          ln -sf dwarfs-universal /usr/local/bin/mkdwarfs
          EOF
      # The build machine's: Clang and LLD build for the target (cmake/cross.cmake) and LLVM's libraries for it
      # (scripts/linux-llvm.sh), ccache caches the compiles, glslang builds the shaders, qemu-user runs the target's
      # own programs, wayland's wayland-scanner the protocols SDL3 builds. Each pacman is tried 3 times, as in the
      # linux job
      - name: Install the build tools
        run: |
          docker exec -i build sh -s <<'EOF'
          set -eu
          retry() { for try in 1 2 3; do "$@" && return; [ "$try" = 3 ] && return 1; sleep 5; done; }
          retry pacman -Syu --noconfirm --needed cmake ninja make patch perl python clang lld llvm glslang qemu-user \
            git pkgconf patchelf wayland ccache
          EOF
      # Saved once a week, as in the linux job. Every architecture's job installs the same, so one of them saves it
      - name: Keep the installed packages
        if: steps.pacman.outputs.cache-hit != 'true'
        run: docker exec build pacman -Sc --noconfirm >/dev/null
      - if: steps.pacman.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/pacman
          key: ${{ steps.pacman.outputs.cache-primary-key }}
      # The target's libraries, where the root wasn't in the cache, saved before anything of this build goes in. The
      # runner's user saves it, and the root's files are root's
      - name: Install the target's libraries
        if: steps.sysroot.outputs.cache-hit != 'true'
        env:
          LINUX_ONLY: ${{ matrix.linux-only && '--linux-only' || '' }}
        run: |
          docker exec -i -e LINUX_ONLY build sh -s <<'EOF'
          set -eu
          scripts/appimage-sysroot.sh /src/sysroot $LINUX_ONLY
          chown -R "$(stat -c %u:%g /src)" /src/sysroot
          chmod -R u+rwX /src/sysroot
          EOF
      - if: steps.sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: sysroot
          key: ${{ steps.sysroot.outputs.cache-primary-key }}
      # LLVM's libraries for the target, as the appimage job builds its own, cross-built against the system root
      - name: Name the LLVM version
        id: llvm
        run: echo "version=$(docker exec build llvm-config --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: llvm-cache
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: linux-llvm-cross-${{ matrix.arch }}-${{ hashFiles('scripts/linux-llvm.sh', 'scripts/llvm-libraries/CMakeLists.txt', 'cmake/llvm_components.cmake') }}-${{ steps.llvm.outputs.version }}
      - name: Cross-build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          docker exec -i -e LLVM_VERSION=${{ steps.llvm.outputs.version }} build sh -s <<'EOF'
          set -eu
          SNX_SYSROOT=/src/sysroot scripts/linux-llvm.sh ${{ matrix.arch }} /src/.cache/llvm/${{ matrix.arch }}
          chown -R "$(stat -c %u:%g /src)" /src/.cache/llvm
          EOF
      - if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/llvm/${{ matrix.arch }}
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      # Through ccache, without debug information, which no one reads in these builds and the AppImage would carry.
      # LLVM is the one built above (-DSNX_LLVM_CONFIG= drops the preset's, the system root's), and a release leaves
      # out scarletnx --mcp's A64 disassembler (SNX_A64_DISASM)
      - name: Cross-build and install
        run: |
          docker exec -i -e CCACHE_DIR=/src/.cache/ccache -e CCACHE_BASEDIR=/src -e CCACHE_NOHASHDIR=true \
            -e SNX_DEPS_CACHE=/src/.cache/deps build sh -s <<'EOF'
          set -eu
          git config --global --add safe.directory '*'
          export SNX_SYSROOT=/src/sysroot
          start=$(date +%s)
          cmake --preset ${{ matrix.preset }} -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF \
            -DSNX_OPT_FLAGS="-O2 -g0" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_DIR=/src/.cache/llvm/${{ matrix.arch }}/lib/cmake/llvm -DSNX_LLVM_CONFIG= -DSNX_A64_DISASM=OFF
          cmake --build --preset ${{ matrix.preset }} --parallel "$(getconf _NPROCESSORS_ONLN)"
          DESTDIR=/src/stage cmake --install build/${{ matrix.preset }}
          # only what this run used is kept, as in the linux job
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - start ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
          mkdir -p /src/.cache/deps
          chown -R "$(stat -c %u:%g /src)" /src/.cache/ccache /src/.cache/deps
          EOF
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # Packaging runs where / is the target's system root, so quick-sharun reads it and the licenses' packages come
      # from its pacman database; the AppImage itself is compressed on the build machine
      - name: Bundle the AppImage
        run: |
          docker exec -i target sh -s <<'EOF'
          set -eu
          cp -a /src/stage/. /
          SKIP_APPIMAGE=1 scripts/make-appimage.sh
          EOF
      - name: Make the AppImage
        run: |
          docker exec -i -e GITHUB_REPOSITORY -e GITHUB_REF_TYPE -e VERSION="$(git describe --always --dirty)" \
            -e MAKE_APPIMAGE_ONLY=1 -e ARCH=${{ matrix.arch }} -e APPIMAGETOOL=/usr/local/bin/appimagetool \
            build sh -s <<'EOF'
          set -eu
          scripts/make-appimage.sh
          EOF
      - name: Check the AppImage
        run: |
          docker exec -i -e ARCH=${{ matrix.arch }} build sh -s <<'EOF'
          set -eu
          scripts/check-appimage.sh
          EOF
      # Only what the script made: dist/ also holds the tracked desktop entry and icon
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: |
            dist/*.AppImage*
            dist/appinfo
      # actions/cache saves .cache/cpm as the runner's user, and its tar fails on what the container's root made that
      # only root may open: FFmpeg's tarball has its top directory 0700
      - name: Give the dependency sources back to the runner
        run: |
          docker exec build chown -R "$(id -u):$(id -g)" /src/.cache/cpm
          # tar saves a link as a link, whatever it points at
          unreadable=$(find .cache/cpm ! -type l ! -readable)
          [ -z "$unreadable" ] || { printf 'actions/cache cannot read:\n%s\n' "$unreadable" >&2; exit 1; }

  windows:
    name: Windows (Clang + LLVM)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # ccache, set up as in the linux job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      # the dependency builds, as in the linux job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # llvm-mingw alone has no LLVM development libraries. Do not mix its C++ runtime with another LLVM build.
      - name: Install Clang, LLVM development files and FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          update: true
          path-type: strict
          install: >-
            git
            make
            patch
            perl
            patchutils
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-nasm
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-ccache
      - name: Check required dependencies
        run: |
          set -euo pipefail
          clang --version
          llvm-config --version
          test -f "$(llvm-config --includedir)/llvm-c/Core.h"
          test -d "$(llvm-config --libdir)"
          llvm-config --libs core native passes target analysis
          make --version
          perl --version
          nasm --version
          spirv-val --version
          spirv-dis --version
      - name: Build the runtime and pinned dependencies
        run: |
          set -euo pipefail
          cmake --preset default \
            -DSNX_LLVM_CONFIG="$(cygpath -m "$(command -v llvm-config)")" \
            -DSNX_FFMPEG_SH="$(cygpath -m /usr/bin/sh.exe)" \
            -DSNX_FFMPEG_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DPERL_EXECUTABLE="$(cygpath -m /usr/bin/perl.exe)" \
            -DSNX_OPENSSL_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DSNX_DEPLOY=OFF -DSNX_TEST_VP9_VECTORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default --prefix stage
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # Explorer and the taskbar show the first icon of an executable's resources (runtime.rc)
      - name: Check the executables' icon
        run: |
          set -euo pipefail
          for exe in stage/bin/scarletnx.exe; do
            # the whole listing first: grep -q stopping early would fail the pipe under pipefail
            resources=$(llvm-readobj --coff-resources "$exe")
            if ! grep -q 'Type: GROUP_ICON' <<<"$resources"; then
              echo "$exe has no icon" >&2
              exit 1
            fi
          done
      - name: Check the native driver
        run: |
          set -euo pipefail
          build/default/scarletnx.exe --help > /dev/null
          build/default/scarletnx.exe --extract --help > /dev/null
          build/default/scarletnx.exe --recomp --help > /dev/null
      - name: Test native tooling and indexed filesystems
        run: |
          set -euo pipefail
          ctest --test-dir build/default --output-on-failure --parallel 4 --exclude-regex '^perf_(cpu|gpu|compile)$'
      - name: Bundle runtime DLLs and licenses
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Follow imports recursively so the artifact works without MSYS2 on PATH.
          # Windows system DLLs are supplied by Windows, never copied from the runner.
          binaries=(stage/bin/*.exe stage/bin/*.dll)
          for ((i = 0; i < ${#binaries[@]}; ++i)); do
            imports=$(llvm-objdump -p "${binaries[i]}")
            while IFS= read -r dll; do
              source="$MINGW_PREFIX/bin/$dll"
              destination="stage/bin/$dll"
              if [[ -f "$source" && ! -f "$destination" ]]; then
                cp "$source" "$destination"
                binaries+=("$destination")
              fi
            done < <(printf '%s\n' "$imports" | awk '/DLL Name:/ { sub(/\r$/, "", $3); print $3 }')
          done
          mkdir -p stage/share/licenses/msys2
          cp -R "$MINGW_PREFIX/share/licenses/." stage/share/licenses/msys2/
          pacman -Q > stage/share/licenses/msys2/build-packages.txt
      - name: Check the artifact without the toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$(Resolve-Path stage/bin);$env:SystemRoot\System32;$env:SystemRoot"
          & .\stage\bin\scarletnx.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-windows-x86_64-${{ steps.commit.outputs.short }}
          path: stage
          if-no-files-found: error

  # The Android app (docs/ANDROID.md), both ABIs on one runner, with the runner's Gradle and JDK. LLVM's libraries for an
  # ABI take most of an hour, so they are kept until the script that builds them changes (both cold: about two hours).
  # Each ABI packs an APK of its own, then one APK holds both
  android:
    name: Android APK
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - uses: actions/cache@v5
        id: llvm-x86_64
        with:
          path: android-llvm/x86_64
          key: android-llvm-x86_64-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      - uses: actions/cache@v5
        id: llvm-arm64
        with:
          path: android-llvm/arm64-v8a
          key: android-llvm-arm64-v8a-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      # The NDK named above, which the runner's image may no longer carry, and NASM for FFmpeg's x86-64 assembly.
      # sdkmanager's download sometimes ends early ("Premature EOF"): tried 3 times, 5 s apart
      - name: Install the NDK and NASM
        run: |
          for try in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_ROOT##*/}" > /dev/null && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          sudo apt-get update && sudo apt-get install -y nasm ccache spirv-tools
      - name: Build LLVM's libraries for x86_64
        if: steps.llvm-x86_64.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh x86_64 "$PWD/android-llvm/x86_64"
      - name: Build LLVM's libraries for arm64-v8a
        if: steps.llvm-arm64.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh arm64-v8a "$PWD/android-llvm/arm64-v8a"
      # ccache, set up as in the linux job: one for both ABIs, which compile apart
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      # the dependency builds, as in the linux job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            # the NDK is installed afresh on each run: its version, not its files' dates, says which compiler it is
            echo "CCACHE_COMPILERCHECK=string:$ANDROID_NDK_ROOT"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # One key signs every APK, so each installs over the one before (docs/ANDROID.md): the ANDROID_KEYSTORE secret, a
      # keystore in base64. A fork's pull request has no secrets: its APKs carry the runner's own debug key, said here
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/scarletnx.keystore"
            echo "SNX_ANDROID_KEYSTORE=$RUNNER_TEMP/scarletnx.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: the runner's own debug key signs this APK, so it does not" \
              "install over one the repository's key signed"
          fi
      # each ABI in a tree and stage of its own, so its APK holds it alone
      - name: Build each ABI's native libraries and APK
        env:
          SNX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for abi in x86_64 arm64-v8a; do
            JAVA_HOME=$JAVA_HOME_21_X64 scripts/android-apk.sh "$PWD/build/android-$abi" "$PWD/android-llvm" "$abi" -- \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cp "build/android-$abi/stage/gradle/outputs/apk/debug/ScarletNX-debug.apk" \
              "ScarletNX-android-$abi-${{ steps.commit.outputs.short }}.apk"
          done
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # both ABIs' libraries, SDL's Java and the icon in one stage, without each APK's Gradle output
      - name: Pack the APK of both ABIs
        env:
          SNX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir stage
          for abi in x86_64 arm64-v8a; do cp -a "build/android-$abi/stage/." stage/; done
          rm -rf stage/gradle
          JAVA_HOME=$JAVA_HOME_21_X64 gradle -p dist/android assembleDebug -Pscarletnx.stage="$PWD/stage" \
            ${SNX_ANDROID_KEYSTORE:+"-Pscarletnx.keystore=$SNX_ANDROID_KEYSTORE"}
          cp stage/gradle/outputs/apk/debug/ScarletNX-debug.apk ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
      # the certificate it carries, in the log; with the repository's key, the one ANDROID_CERT_SHA256 (a variable) names
      - name: Check the APK's signer
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # "Signer #1 certificate ...", "V2 Signer: certificate ..." (apksigner 37) or, for a signer of some SDK
          # versions, "Signer (minSdkVersion=...) certificate ..."
          cert=$(sed -n -E 's/^(V[0-9.]+ )?Signer[^:]*:? certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" |
                 sort -u)
          if [ -z "$cert" ] || [ "$(wc -l <<< "$cert")" != 1 ]; then
            echo "::error::apksigner names no one certificate of $apk"
            exit 1
          fi
          echo "signed by the certificate of SHA-256 $cert"
          if [ -n "${SNX_ANDROID_KEYSTORE:-}" ] && [ -n "$EXPECTED" ] && [ "$cert" != "$EXPECTED" ]; then
            echo "::error::signed by $cert, not the repository's key ($EXPECTED)"
            exit 1
          fi
      # A library that needs one Android 5.0 lacks fails to load there, and the app with it
      - name: Check the APK's libraries
        run: |
          set -euo pipefail
          apk=ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          mkdir apk && unzip -q "$apk" 'lib/*' -d apk
          system=" libc.so libm.so libdl.so liblog.so libandroid.so libz.so libEGL.so libGLESv1_CM.so libGLESv2.so libOpenSLES.so "
          for abi in x86_64 arm64-v8a; do
            for lib in libmain.so libscarletnx.so libscarletnx-run.so; do
              test -f "apk/lib/$abi/$lib" || { echo "$abi has no $lib" >&2; exit 1; }
              for needed in $("$readelf" -d "apk/lib/$abi/$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
                [[ "$system" == *" $needed "* || -f "apk/lib/$abi/$needed" ]] ||
                  { echo "$abi/$lib needs $needed, which Android 5.0 does not have" >&2; exit 1; }
              done
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      # Not zipped: each artifact is an APK itself, named after it
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-x86_64-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-arm64-v8a-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error

  # macOS and iOS (docs/APPLE.md), both on one Apple silicon runner with Xcode's Clang and SDKs; FFmpeg, OpenSSL and
  # SDL3 are built from the pinned sources as everywhere. Until both have built green once, a failure here does not
  # fail the run (continue-on-error), which would hold back the nightly: they are new, and no Mac checked them before
  # CI. iOS builds even when macOS failed, and each one's app is made from its own build alone. Each app carries
  # Ryujinx's MoltenVK (V380-Ori/Ryujinx.MoltenVK): mainline's lacks patches emulators' pipelines need. The release's
  # tars, their SHA-256 the ones GitHub lists for them
  apple:
    name: macOS and iOS (arm64)
    runs-on: macos-26
    timeout-minutes: 240
    continue-on-error: true
    env:
      MOLTENVK_RELEASE: v1.4.1-ryujinx
      MOLTENVK_MACOS_SHA256: ea1c633808d0a61e86ee35af4bdc280f5f07f95633b95935f3e695dc5226e640
      MOLTENVK_IOS_SHA256: 7cec48d4e73cf9eb89b60e8596758900caaf8398c49ae8abe4544295fb7e0c84
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # LLVM's libraries for each (scripts/apple-llvm.sh) with AArch64's code generator alone, the one the recompiler
      # uses, built once per script and Xcode. Saved as soon as they are built: actions/cache saves only a job that
      # succeeds, and a later step's failure would build them again next run. Xcode's Clang builds everything, as a
      # user's Mac does
      - name: Name the Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: macos-llvm
        with:
          path: apple-llvm
          key: macos-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      - uses: actions/cache/restore@v5
        id: ios-llvm
        with:
          path: ios-llvm
          key: ios-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Install tools
        run: brew install ninja ccache
      - name: Build LLVM's libraries for macOS
        id: macos-llvm-build
        if: steps.macos-llvm.outputs.cache-hit != 'true'
        run: scripts/apple-llvm.sh macos "$PWD/apple-llvm"
      - if: steps.macos-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: apple-llvm
          key: ${{ steps.macos-llvm.outputs.cache-primary-key }}
      - name: Build LLVM's libraries for iOS
        id: ios-llvm-build
        if: ${{ !cancelled() && steps.ios-llvm.outputs.cache-hit != 'true' }}
        run: scripts/apple-llvm.sh ios "$PWD/ios-llvm"
      - if: ${{ !cancelled() && steps.ios-llvm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ios-llvm
          key: ${{ steps.ios-llvm.outputs.cache-primary-key }}
      # ccache and the dependency builds, set up as in the linux job: one of each for both, which compile apart
      - uses: actions/cache/restore@v5
        if: ${{ !cancelled() }}
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - uses: actions/cache/restore@v5
        if: ${{ !cancelled() }}
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        if: ${{ !cancelled() }}
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$GITHUB_WORKSPACE/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build the runtime for macOS
        id: macos-build
        if: ${{ !cancelled() && steps.macos-llvm-build.outcome != 'failure' }}
        run: |
          cmake --preset macos -DLLVM_DIR="$PWD/apple-llvm/lib/cmake/llvm" -DSNX_TEST_VP9_VECTORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset macos --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Build the app for iOS
        id: ios-build
        if: ${{ !cancelled() && steps.ios-llvm-build.outcome != 'failure' }}
        run: |
          cmake --preset ios -DLLVM_DIR="$PWD/ios-llvm/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset ios --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Trim the compiler cache
        if: ${{ !cancelled() }}
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() }}
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        if: ${{ !cancelled() }}
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(shasum -a 256 <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key }}
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      - name: Check the ABI helpers compile
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        run: clang -fsyntax-only -Wall -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        run: ctest --test-dir build/macos --output-on-failure --parallel 4 --exclude-regex '^perf_(cpu|gpu|compile)$'
      # the app, signed ad hoc, and its zip, by CPack (cmake/apple_package.cmake)
      - name: Make the macOS app
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        run: |
          curl -fL -o moltenvk-macos.tar \
            "https://github.com/V380-Ori/Ryujinx.MoltenVK/releases/download/$MOLTENVK_RELEASE/MoltenVK-macos.tar"
          echo "$MOLTENVK_MACOS_SHA256  moltenvk-macos.tar" | shasum -a 256 -c
          mkdir moltenvk-macos && tar -xf moltenvk-macos.tar -C moltenvk-macos
          cmake build/macos -DSNX_MOLTENVK="$PWD/moltenvk-macos"
          cpack --config build/macos/CPackConfig.cmake -B app-macos \
            -D CPACK_PACKAGE_FILE_NAME=ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}
          mv app-macos/ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}.zip .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.macos-build.outcome == 'success' }}
        with:
          path: ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}.zip
          archive: false
          if-no-files-found: error
      # Unsigned: AltStore, SideStore or a developer account sign it for the device it goes on, with
      # dist/apple/ScarletNX.entitlements
      - name: Make the IPA
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        run: |
          curl -fL -o moltenvk-ios.tar \
            "https://github.com/V380-Ori/Ryujinx.MoltenVK/releases/download/$MOLTENVK_RELEASE/MoltenVK-ios.tar"
          echo "$MOLTENVK_IOS_SHA256  moltenvk-ios.tar" | shasum -a 256 -c
          mkdir moltenvk-ios && tar -xf moltenvk-ios.tar -C moltenvk-ios
          cmake build/ios -DSNX_MOLTENVK="$PWD/moltenvk-ios"
          cpack --config build/ios/CPackConfig.cmake -B app-ios \
            -D CPACK_PACKAGE_FILE_NAME=ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}
          mv app-ios/ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}.ipa .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        with:
          path: ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}.ipa
          archive: false
          if-no-files-found: error

  # The packages as a user gets them, each on a runner of its own (scripts/check-package.sh): in the build jobs the
  # checkout sits where the package looks for one, and stands in for what an installed copy lacks
  appimage-check:
    name: Linux AppImage (${{ matrix.arch }}), as installed
    needs: appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: dist
      # Artifacts drop the executable bit
      - name: Run the AppImage as a user would
        run: |
          chmod +x dist/*.AppImage
          scripts/check-package.sh dist/*.AppImage

  # The cross-built AppImage as installed, as the appimage-check job runs its own: qemu's binfmt handlers run it, and
  # everything it starts, as a machine of that architecture would
  appimage-cross-check:
    name: Linux AppImage (${{ matrix.arch }}), as installed
    needs: appimage-cross
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: # platform as Docker names it, qemu as qemu-user and binfmt_misc do
          - arch: ppc64le
            platform: ppc64le
            qemu: ppc64le
          - arch: riscv64
            platform: riscv64
            qemu: riscv64
          - arch: loongarch64
            platform: loong64
            qemu: loongarch64
          - arch: ppc64
            platform: ppc64
            qemu: ppc64
    steps:
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      # The AppImage itself runs through qemu-user (scripts/check-package.sh says why), the programs it starts through the
      # binfmt handler the next step registers: installed first, as its package's systemd trigger can clear the handlers
      # registered before it. No recommends: qemu-user-binfmt would register handlers of its own
      - name: Install qemu-user
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Set up qemu emulation for ${{ matrix.arch }}
        if: matrix.platform != 'ppc64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}
      # tonistiigi/binfmt, which setup-qemu-action registers, has no big-endian ppc64: the runner's qemu-user runs its
      # programs instead, by the magic and mask Debian's qemu-user-binfmt gives them (its qemu-ppc64.conf). F opens
      # qemu now, so the containers use it too, and P keeps argv[0], as qemu reads from the kernel since 9.0
      - name: Set up qemu emulation for ppc64
        if: matrix.platform == 'ppc64'
        run: |
          printf ':qemu-ppc64:M::%s:%s:%s:POCF\n' \
            '\x7f\x45\x4c\x46\x02\x02\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x15' \
            '\xff\xff\xff\xff\xff\xff\xff\xfc\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff' \
            "$(command -v qemu-ppc64)" | sudo tee /proc/sys/fs/binfmt_misc/register
          head -n 3 /proc/sys/fs/binfmt_misc/qemu-ppc64
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: dist
      # Artifacts drop the executable bit
      # Each game the AppImage makes is a copy of it, and an AppImage carries "AI\x02" in its ELF header's padding,
      # where the handler above wants zeros: one more handler, made from the AppImage's own first 20 bytes with the
      # padding left out, runs them through qemu-user. P keeps argv[0], by which the AppImage's runtime runs the dwarfs
      # tool it carries as itself; both handlers are printed. e_type's low byte, executable or shared, is left to either:
      # byte 16 of a little-endian header, 17 of a big-endian one (EI_DATA 2, PowerPC64 BE's)
      - name: Run ${{ matrix.arch }} AppImages through qemu-user
        run: |
          set -- $(head -c 20 dist/*.AppImage | od -An -v -tx1)
          low=$(($6 == 2 ? 17 : 16))
          magic= mask= i=0
          for byte in "$@"; do
            case $i in 7|8|9|10|11|12|13|14|15) byte=00 m=00 ;; "$low") m=fe ;; *) m=ff ;; esac
            magic=$magic\\x$byte mask=$mask\\x$m i=$((i + 1))
          done
          printf ':appimage-%s:M::%s:%s:%s:POCF\n' ${{ matrix.qemu }} "$magic" "$mask" "$(command -v qemu-${{ matrix.qemu }})" |
            sudo tee /proc/sys/fs/binfmt_misc/register
          grep -qx enabled /proc/sys/fs/binfmt_misc/appimage-${{ matrix.qemu }}
          head -n 3 /proc/sys/fs/binfmt_misc/qemu-${{ matrix.qemu }} /proc/sys/fs/binfmt_misc/appimage-${{ matrix.qemu }}
      - name: Run the AppImage as a user would
        run: |
          grep -qx enabled /proc/sys/fs/binfmt_misc/qemu-${{ matrix.qemu }} ||
            { echo "no binfmt handler runs ${{ matrix.qemu }} programs here" >&2; exit 1; }
          chmod +x dist/*.AppImage
          scripts/check-package.sh dist/*.AppImage

  windows-check:
    name: Windows zip, as installed
    needs: windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      # Not in the workspace root: the build's checkout was there, and the package would take this one for it
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: ScarletNX-windows-x86_64-${{ steps.commit.outputs.short }}
          path: package
      - name: Run the zip's scarletnx.exe as a user would
        run: bash source/scripts/check-package.sh package/bin/scarletnx.exe

  # edenprobe's probes (docs/EDENPROBE.md), a release of scarletnx/edenprobe pinned by its sha256, recompiled by the
  # Linux install and run on lavapipe: a case of tests/edenprobe/linux-x86_64.txt, the ones that passed before, that no
  # longer passes fails the job. Another release or other mode words want that file written again
  edenprobe:
    name: edenprobe (Linux x86_64, lavapipe)
    needs: linux
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: archlinux:latest
    env:
      EDENPROBE_VERSION: v0.5.0
      EDENPROBE_SHA256: 666391a760358d4fb80376a8873b2cde7e5990c0c58242926f7c5b95ed3cbf75
      # every family that needs no person or network: headless, the audio family's sound is never played
      EDENPROBE_MODE: quick notime fatal cpu graphics fs video display kernel audio
    outputs:
      result: ${{ steps.probe.outputs.result }}
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      # The libraries the install links, and lavapipe; each pacman install tried 3 times, as in the Linux job
      - name: Install the runtime's libraries and lavapipe
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed python llvm-libs sdl3 vulkan-icd-loader vulkan-swrast spirv-tools && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-x86_64-${{ steps.commit.outputs.short }}-install
          path: stage
      - name: Fetch edenprobe
        run: |
          if [ -z "$EDENPROBE_SHA256" ]; then
            echo "EDENPROBE_SHA256 is empty: pin the sha256 of edenprobe $EDENPROBE_VERSION" >&2
            exit 1
          fi
          curl -fsSL --retry 3 -o edenprobe.nro \
            "https://github.com/scarletnx/edenprobe/releases/download/$EDENPROBE_VERSION/edenprobe.nro"
          echo "$EDENPROBE_SHA256  edenprobe.nro" | sha256sum -c -
      # Artifacts drop the executable bit. The summary's title is the line of the pull request's comment (links)
      - name: Run edenprobe
        id: probe
        run: |
          chmod +x stage/bin/*
          status=0
          python3 scripts/edenprobe.py run --runtime stage/bin/scarletnx --nro edenprobe.nro --mode "$EDENPROBE_MODE" \
            --out edenprobe --baseline tests/edenprobe/linux-x86_64.txt --summary "$GITHUB_STEP_SUMMARY" || status=$?
          if [ -f edenprobe/summary.md ]; then
            echo "result=$(head -n 1 edenprobe/summary.md | cut -c5-)" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      # edenprobe's main, cases the release has not got yet: beside the release's report it only warns, and a nightly
      # that cannot be fetched is a warning too (docs/EDENPROBE.md)
      - name: Fetch edenprobe's main
        id: main
        if: ${{ !cancelled() }}
        run: |
          url=https://github.com/scarletnx/edenprobe/releases/download/nightly
          if curl -fsSL --retry 3 -o edenprobe-main.nro "$url/edenprobe.nro" &&
            curl -fsSL --retry 3 -o edenprobe-main.nro.sha256 "$url/edenprobe.nro.sha256" &&
            echo "$(cut -d ' ' -f 1 edenprobe-main.nro.sha256)  edenprobe-main.nro" | sha256sum -c -; then
            echo "nro=edenprobe-main.nro" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=edenprobe main::edenprobe's nightly could not be fetched or checked"
          fi
      - name: Run edenprobe's main, warnings only
        if: ${{ !cancelled() && steps.main.outputs.nro }}
        run: |
          chmod +x stage/bin/*
          python3 scripts/edenprobe.py run --runtime stage/bin/scarletnx --nro edenprobe-main.nro \
            --mode "$EDENPROBE_MODE" --out edenprobe-main --advisory edenprobe/report.jsonl \
            --summary "$GITHUB_STEP_SUMMARY"
      # The report, the failures' pictures, the logs and this run's baseline.txt; not the recompiled game. Each attempt
      # its own: a run takes one artifact of a name, and a job run again keeps the earlier attempt's to compare
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: edenprobe-${{ steps.commit.outputs.short }}-${{ github.run_attempt }}
          path: |
            edenprobe
            !edenprobe/work
            edenprobe-main
            !edenprobe-main/work

  # A pull request's builds, linked from a comment on it that each run rewrites, as soon as they are built
  # (scripts/pr-builds.sh). A pull request from a fork gets a token that may not write, so it gets none
  links:
    name: Links to the builds
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [linux, appimage, appimage-cross, windows, android, apple, edenprobe]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/pr-builds.sh
          sparse-checkout-cone-mode: false
      - name: Link the builds from the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/pr-builds.sh "$GITHUB_REPOSITORY" "$PR" "$GITHUB_RUN_ID" "$SHA"
