name: Cache cleanup

# The repository's caches share 10 GB, past which GitHub evicts the least recently used: deleting the ones no run will
# read again (scripts/trim-caches.py) keeps that room for the ones builds restore, the Android LLVM's above all
on:
  # A closed pull request's caches. pull_request_target, so a fork's are deleted too: GitHub runs the default branch's
  # copy of this file whatever the base, and the job checks out that branch, nothing of the pull request
  pull_request_target:
    types: [closed]
  # The entries a build's new caches replaced
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted, delete nothing
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  pull-requests: read

# One pass at a time: a pass waiting behind it reads the listing afresh
concurrency:
  group: cache-cleanup

jobs:
  trim:
    name: Delete the caches no run reads again
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Delete them
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python3 scripts/trim-caches.py --dry-run
          else
            python3 scripts/trim-caches.py
          fi
