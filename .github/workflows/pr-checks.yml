name: Pull request checks

# What a pull request is held by besides its build, one job for each kind of event, so an event takes one runner. A
# ruleset of main would require them by the names they run under:
# - "Title and assignees": a title with a donotmerge mark ([donotmerge needs #N]) fails until the mark is out, and so
#   does a pull request while someone assigned to it, its author aside, has not approved it. An issue or pull request
#   opened, or whose title changed, gets the labels its [area] prefix asks for (scripts/area-labels.py), only added.
#   It runs on pull_request_target and pull_request_review with the base branch's scripts (GitHub takes this workflow
#   from the default branch), so a pull request can't change the check it is held by and the token may label a
#   fork's; nothing of the pull request is checked out or run
#   A close runs the same job, under another name: it cancels the pull request's runs still going
#   (scripts/cancel-pr-runs.py), as GitHub keeps a run going once its pull request is closed
# - "Tracked material and docs": tests/tracked_material.py (keys, dumps, the console maker's name, piracy sites),
#   scripts/check-docs.py and the Claude files' ASD-STE100 check (.claude/skills/ste100), the pull request's own
#   scripts on its own files, on pull_request, whose token can't write for a fork. They read files build.yml skips a
#   pull request for, so they run on every pull request
# Each run checks all its check stands for, so the newest on a commit is the answer. A job not for the event is
# skipped under another name, as a skipped job passes and would stand for the check, and in a concurrency group of its
# run alone. An edit of neither the title nor the base runs nothing: the commit's check stays the one before
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, assigned, unassigned, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions: {}

jobs:
  title-and-assignees:
    # the required check's name on a pull request; an issue only gets its labels
    name: >-
      ${{ github.event.action == 'closed' && 'Cancel its runs still going' ||
      (github.event_name == 'pull_request_target' &&
      (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) ||
      github.event_name == 'pull_request_review') && 'Title and assignees' ||
      github.event_name == 'issues' && (github.event.action == 'opened' || github.event.changes.title)
      && 'Label the area' || 'Title and assignees (not for this event, or an edit of neither the title nor the base)' }}
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'issues' && (github.event.action == 'opened' || github.event.changes.title)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write # a close's cancel
      contents: read
      issues: write
      pull-requests: write
    # one at a time per issue or pull request: of a burst of events the newest waits and those before it are dropped,
    # and the one that runs checks everything anew. Never skipped on an event it runs for, as a skipped check passes. A
    # close waits for nothing
    concurrency:
      group: >-
        title-and-assignees-${{ github.event.action == 'closed' && format('closed-{0}', github.run_id) ||
        (github.event_name == 'pull_request_target' &&
        (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) ||
        github.event_name == 'pull_request_review' ||
        github.event_name == 'issues' && (github.event.action == 'opened' || github.event.changes.title))
        && (github.event.pull_request.number || github.event.issue.number) || format('skipped-{0}', github.run_id) }}
    steps:
      # the scripts of the branch it merges into, as it is now (the default branch for an issue), never the pull request
      - if: github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            scripts/pr-title.py
            scripts/area-labels.py
            scripts/pr-assignees.py
          sparse-checkout-cone-mode: false
      # on every pull request event, a review's too: a run that checked less would pass for the title it did not read
      - name: Check the title
        if: github.event_name != 'issues' && github.event.action != 'closed'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/pr-title.py "$TITLE"
      # also under a donotmerge mark, whose check failed above
      - name: Add the area labels
        if: ${{ !cancelled() && (github.event.action == 'opened' || github.event.changes.title) }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
        run: |
          wanted=$(python3 scripts/area-labels.py "$TITLE")
          [ -n "$wanted" ] || exit 0
          have=$(gh api --paginate "repos/$GITHUB_REPOSITORY/labels" --jq '.[].name')
          add=()
          while IFS= read -r label; do
            # a label the repository lacks is made in the areas' colour; one it has keeps its own
            grep -qxF "$label" <<<"$have" ||
              gh api "repos/$GITHUB_REPOSITORY/labels" -f name="$label" -f color=1d76db >/dev/null
            add+=(-f "labels[]=$label")
          done <<<"$wanted"
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" "${add[@]}" >/dev/null
      # read now, not from the event: an assignment or a review that came after it counts. Also under a donotmerge
      # mark, so the run says both
      - name: Read the assignees and the reviews
        if: ${{ !cancelled() && github.event_name != 'issues' && github.event.action != 'closed' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '{author: .user.login, assignees: [.assignees[].login]}' >pr.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | {user: .user.login, state}' |
            jq -s . >reviews.json
          jq -s '.[0] + {reviews: .[1]}' pr.json reviews.json >state.json
      - name: Check every assignee approved
        if: ${{ !cancelled() && github.event_name != 'issues' && github.event.action != 'closed' }}
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ ! -f scripts/pr-assignees.py ]; then
            echo "scripts/pr-assignees.py is not on $BASE: the check runs $BASE's copy, so it waits for it to merge" >&2
            exit 1
          fi
          python3 scripts/pr-assignees.py state.json
      # the default branch's script, as the workflow is, never the pull request's: an older base's takes other arguments
      - if: github.event.action == 'closed'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/cancel-pr-runs.py
          sparse-checkout-cone-mode: false
      - name: Cancel them
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # empty when the fork it came from is gone
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
        run: python3 scripts/cancel-pr-runs.py "$PR" "$HEAD_REPO" "$HEAD_BRANCH" --closed-at "$CLOSED_AT"

  tracked-material-and-docs:
    name: >-
      ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && 'Tracked material and docs' || 'Tracked material and docs (runs on pull_request)' }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    # a push cancels the run of the commit before it
    concurrency:
      group: >-
        tracked-material-and-docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number
        || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Tracked material, its self-test then the checkout
        run: |
          python3 tests/tracked_material.py --self-test
          python3 tests/tracked_material.py .
      # also after tracked material failed, so the run says both
      - name: Docs, the checks on checkouts made to fail them then the checkout
        if: ${{ !cancelled() }}
        run: |
          python3 tests/docs_test.py
          python3 scripts/check-docs.py
      # also after the steps before it failed, so the run says each
      - name: Claude files in ASD-STE100, the checker's self-test then the checkout
        if: ${{ !cancelled() }}
        run: |
          sh .claude/skills/ste100/test/test-check.sh
          python3 .claude/skills/ste100/check.py --all
