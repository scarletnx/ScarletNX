name: Pull request checks

# What a pull request is held by besides its build, a job each:
# - title: a pull request whose title still holds a donotmerge mark ([donotmerge needs #N]) fails until the mark is out.
#   An issue or pull request opened, or whose title changed, gets the labels its [area] prefix and words ask for
#   (scripts/area-labels.py); labels are only added, so one a maintainer took off stays off until the title changes
# - assignees: a pull request fails while someone assigned to it, its author aside, has not approved it: assigning
#   someone whose pending work it touches holds its merge for their approval, and taking them off lets it go
# - tracked material: what the tracked files may not hold (tests/tracked_material.py): keys, dumps, the console maker's
#   name as a word and the names of piracy sites. It reads every tracked file, documentation included, so it runs on
#   every pull request, including those build.yml skips for touching only files no build or test reads
# - docs: the documentation held to the checkout (scripts/check-docs.py): links and anchors that resolve, the ## Index
#   of each long doc and docs/README.md linking every doc. It runs on every pull request for the same reason, as one
#   that changes only docs skips build.yml
# As required checks of main the title and the assignees keep the merge button off.
#
# The title and the assignees run on pull_request_target, which takes this workflow and its scripts from the base
# branch, so a pull request can't change the check it is held by, and lets the token label a pull request from a fork;
# nothing of the pull request is checked out or run. Tracked material runs the pull request's own script on its own
# files, so it runs on pull_request, whose token can't write for a fork, and never on pull_request_target. Every event
# starts every job, and one that is not for the event is skipped: it takes another name than its check's, as a skipped
# job passes and would stand for the check of that name, and a concurrency group of its run alone, so it can't drop a
# job that runs
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, assigned, unassigned]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions: {}

jobs:
  title:
    # the required check's name on a pull request; an issue only gets its labels
    name: >-
      ${{ github.event_name == 'pull_request_target' && 'No donotmerge in the title'
      || github.event_name == 'issues' && 'Label the area' || 'Title (runs on pull_request_target and issues)' }}
    if: github.event_name == 'pull_request_target' || github.event_name == 'issues'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # one at a time per issue or pull request: of a burst of edits the newest waits and those before it are dropped.
    # Never skipped on a pull_request_target event, as a skipped required check passes
    concurrency:
      group: >-
        title-${{ (github.event_name == 'pull_request_target' || github.event_name == 'issues')
        && (github.event.pull_request.number || github.event.issue.number) || format('skipped-{0}', github.run_id) }}
    steps:
      # the base branch as it is now (the default branch for an issue), never the pull request
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/pr-title.py
            scripts/area-labels.py
          sparse-checkout-cone-mode: false
      - name: Check the title
        if: github.event_name == 'pull_request_target'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/pr-title.py "$TITLE"
      # also under a donotmerge mark, whose check failed above
      - name: Add the area labels
        if: ${{ !cancelled() && (github.event.action == 'opened' || github.event.changes.title) }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
        run: |
          wanted=$(python3 scripts/area-labels.py "$TITLE")
          [ -n "$wanted" ] || exit 0
          have=$(gh api --paginate "repos/$GITHUB_REPOSITORY/labels" --jq '.[].name')
          add=()
          while IFS= read -r label; do
            # a label the repository lacks is made in the areas' colour; one it has keeps its own
            grep -qxF "$label" <<<"$have" ||
              gh api "repos/$GITHUB_REPOSITORY/labels" -f name="$label" -f color=1d76db >/dev/null
            add+=(-f "labels[]=$label")
          done <<<"$wanted"
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" "${add[@]}" >/dev/null

  assignees:
    name: >-
      ${{ (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
      && 'Assignees approved' || 'Assignees (run on pull_request_target and pull_request_review)' }}
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    # one at a time per pull request, as the title: the newest of a burst waits and those before it are dropped
    concurrency:
      group: >-
        pr-assignees-${{ (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
        && github.event.pull_request.number || format('skipped-{0}', github.run_id) }}
    steps:
      # the script of the branch it merges into, as it is now
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: scripts/pr-assignees.py
          sparse-checkout-cone-mode: false
      # read now, not from the event: an assignment or a review that came after it counts
      - name: Read the assignees and the reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '{author: .user.login, assignees: [.assignees[].login]}' >pr.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | {user: .user.login, state}' |
            jq -s . >reviews.json
          jq -s '.[0] + {reviews: .[1]}' pr.json reviews.json >state.json
      - name: Check every assignee approved
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ ! -f scripts/pr-assignees.py ]; then
            echo "scripts/pr-assignees.py is not on $BASE: the check runs $BASE's copy, so it waits for it to merge" >&2
            exit 1
          fi
          python3 scripts/pr-assignees.py state.json

  tracked-material:
    name: >-
      ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && 'Tracked material' || 'Tracked material (runs on pull_request)' }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    # a push cancels the run of the commit before it
    concurrency:
      group: >-
        tracked-material-${{ github.event_name == 'pull_request' && github.event.pull_request.number
        || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Self-test, then the checkout
        run: |
          python3 tests/tracked_material.py --self-test
          python3 tests/tracked_material.py .

  docs:
    name: >-
      ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && 'Docs' || 'Docs (runs on pull_request)' }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    # a push cancels the run of the commit before it
    concurrency:
      group: >-
        docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: The checks on checkouts made to fail them, then the checkout
        run: |
          python3 tests/docs_test.py
          python3 scripts/check-docs.py
