name: Pull request checks

# What a pull request is held by besides its build:
# - title and assignees: a pull request whose title still holds a donotmerge mark ([donotmerge needs #N]) fails until
#   the mark is out, and so does one while someone assigned to it, its author aside, has not approved it: assigning
#   someone whose pending work it touches holds its merge for their approval, and taking them off lets it go. A pull
#   request opened, or whose title changed, gets the labels its [area] prefix and words ask for
#   (scripts/area-labels.py); labels are only added, so one a maintainer took off stays off until the title changes
#
# Each run of a check checks all it stands for, so its newest run on a commit is the whole answer. A ruleset of main
# that held the merge would require them by the names they run under: "Title and assignees" and "Tracked material and
# docs". The checks that run on other events are workflows of their own: tracked-material-and-docs.yml,
# issue-labels.yml and pr-builds.yml. No job here is skipped, and each has a plain name: GitHub does not fill in the
# name of a job it skips, and showed the expression itself in the checks list (actions/runner#1215).
#
# The title and the assignees run on pull_request_target, which takes this workflow and its scripts from the base
# branch, so a pull request can't change the check it is held by, and lets the token label a pull request from a fork;
# a review's run (pull_request_review) checks out the base branch's scripts too. Nothing of the pull request is checked
# out or run.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, assigned, unassigned]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  title-and-assignees:
    name: Title and assignees
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # one at a time per pull request: of a burst of events the newest waits and those before it are dropped, and the
    # one that runs checks everything anew. Never skipped on an event it runs for, as a skipped check passes
    concurrency:
      group: title-and-assignees-${{ github.event.pull_request.number }}
    steps:
      # the scripts of the branch it merges into, as it is now, never the pull request
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            scripts/pr-title.py
            scripts/area-labels.py
            scripts/pr-assignees.py
          sparse-checkout-cone-mode: false
      # on every pull request event, a review's too: a run that checked less would pass for the title it did not read
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/pr-title.py "$TITLE"
      # also under a donotmerge mark, whose check failed above
      - name: Add the area labels
        if: ${{ !cancelled() && (github.event.action == 'opened' || github.event.changes.title) }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          wanted=$(python3 scripts/area-labels.py "$TITLE")
          [ -n "$wanted" ] || exit 0
          have=$(gh api --paginate "repos/$GITHUB_REPOSITORY/labels" --jq '.[].name')
          add=()
          while IFS= read -r label; do
            # a label the repository lacks is made in the areas' colour; one it has keeps its own
            grep -qxF "$label" <<<"$have" ||
              gh api "repos/$GITHUB_REPOSITORY/labels" -f name="$label" -f color=1d76db >/dev/null
            add+=(-f "labels[]=$label")
          done <<<"$wanted"
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" "${add[@]}" >/dev/null
      # read now, not from the event: an assignment or a review that came after it counts. Also under a donotmerge
      # mark, so the run says both
      - name: Read the assignees and the reviews
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '{author: .user.login, assignees: [.assignees[].login]}' >pr.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | {user: .user.login, state}' |
            jq -s . >reviews.json
          jq -s '.[0] + {reviews: .[1]}' pr.json reviews.json >state.json
      - name: Check every assignee approved
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ ! -f scripts/pr-assignees.py ]; then
            echo "scripts/pr-assignees.py is not on $BASE: the check runs $BASE's copy, so it waits for it to merge" >&2
            exit 1
          fi
          python3 scripts/pr-assignees.py state.json
