name: Publish builds

# The builds as releases (scripts/publish-builds.py), and a version said on Discord: a version tag (v...) pushed that
# builds everywhere a release of this repository; the first scheduled run of main of a day (UTC) that builds everywhere,
# or one by hand, that day's nightly in scarletnx/nightly, every one kept; every push to main this repository's one prerelease of main, main-<commit>, each package as its job ends; every
# pull request a prerelease there, pr-<number>, replaced at each push and deleted when it closes without a
# merge, or once a nightly has it. A fork's pull request only once someone of the team
# labels it "publish builds" after its last push. Nothing of a pull request runs here: the files are its Build run's
# artifacts, and the checkout is main's. The secrets: NIGHTLY_TOKEN may write scarletnx/nightly's contents;
# DISCORD_WEBHOOK_RELEASES is the releases channel's webhook (without it, nothing is posted there and the run says so).
# The nightlies' and the pull requests' cards are ReiWimsy's (scarletnx/wimsy-core), which sees the releases change
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  # pull_request_target, so a fork's are seen too: closed, labeled, or pushed to (its label then comes off)
  pull_request_target:
    types: [closed, labeled, synchronize]
  # a package of a push to main just uploaded: build.yml's job starts this with its run, which GITHUB_TOKEN may do
  workflow_dispatch:
    inputs:
      run:
        description: The Build run of a push to main whose packages go to main's prerelease
        required: true

permissions:
  contents: write # a release, and the "nightly" prerelease's link
  actions: read # the Build run's artifacts and jobs
  checks: read # Amberlith's notice, for the comment of builds
  pull-requests: write # a fork's label, taken off at its push, and the comment of builds

jobs:
  publish:
    name: Publish the builds
    # a push to the repository's own pull request, or another label, has nothing for it. Nor has a Build a newer push
    # cancelled: waiting in the group below, it would take the place of the one before it that built
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'cancelled' ||
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) ||
      github.event.action == 'closed' ||
      (github.event.action == 'labeled' && github.event.label.name == 'publish builds') ||
      (github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name != github.repository)
    # One at a time for main's prerelease, each version and each pull request. A group holds one waiting job, which a
    # newer one replaces: main's each bring the prerelease to everything its run has at the time, so the newer loses
    # nothing, and the newer build is the one to publish (a fork's pull request, which its run cannot name, goes by its
    # commit). On the job, not the workflow: an event the job skips never waits, so the pull request's checks show no
    # run cancelled for it
    concurrency:
      group: >-
        publish-${{ github.event_name == 'workflow_dispatch' && 'main' ||
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch ||
        github.event.pull_request.number ||
        github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      NIGHTLY_REPO: scarletnx/nightly
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NIGHTLY_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
      DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
    steps:
      # main's scripts, and its history and tags for the changes the notes list
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # A closed pull request's prerelease is deleted, and a fork's pushed one loses its label, here
      - name: Find the builds to publish
        id: plan
        run: python3 scripts/publish-builds.py plan --repo "$GITHUB_REPOSITORY" --to "$NIGHTLY_REPO"
      # Each by its name, as the release job takes them, into a folder of its own. A pull request's job that failed made
      # none: its notes say so
      - name: Download the x86-64 AppImage
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-linux-x86_64.AppImage '))
        continue-on-error: ${{ steps.plan.outputs.kind == 'pr' || steps.plan.outputs.kind == 'main' }}
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-x86_64-${{ steps.plan.outputs.short }}.AppImage
          path: artifacts/ScarletNX-linux-x86_64-${{ steps.plan.outputs.short }}.AppImage
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the ARM64 AppImage
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-linux-aarch64.AppImage '))
        continue-on-error: ${{ steps.plan.outputs.kind == 'pr' || steps.plan.outputs.kind == 'main' }}
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-aarch64-${{ steps.plan.outputs.short }}.AppImage
          path: artifacts/ScarletNX-linux-aarch64-${{ steps.plan.outputs.short }}.AppImage
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the PowerPC64 LE AppImage
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-linux-ppc64le.AppImage '))
        continue-on-error: true # its job may fail without failing the run: the notes say not built
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-ppc64le-${{ steps.plan.outputs.short }}.AppImage
          path: artifacts/ScarletNX-linux-ppc64le-${{ steps.plan.outputs.short }}.AppImage
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the PowerPC64 BE AppImage
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-linux-ppc64.AppImage '))
        continue-on-error: true # its job may fail without failing the run: the notes say not built
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-ppc64-${{ steps.plan.outputs.short }}.AppImage
          path: artifacts/ScarletNX-linux-ppc64-${{ steps.plan.outputs.short }}.AppImage
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the RISC-V 64 AppImage
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-linux-riscv64.AppImage '))
        continue-on-error: true # its job may fail without failing the run: the notes say not built
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-riscv64-${{ steps.plan.outputs.short }}.AppImage
          path: artifacts/ScarletNX-linux-riscv64-${{ steps.plan.outputs.short }}.AppImage
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the LoongArch64 AppImage
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-linux-loongarch64.AppImage '))
        continue-on-error: true # its job may fail without failing the run: the notes say not built
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-loongarch64-${{ steps.plan.outputs.short }}.AppImage
          path: artifacts/ScarletNX-linux-loongarch64-${{ steps.plan.outputs.short }}.AppImage
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the Windows build
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-windows-x86_64.zip '))
        continue-on-error: ${{ steps.plan.outputs.kind == 'pr' || steps.plan.outputs.kind == 'main' }}
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-windows-x86_64-${{ steps.plan.outputs.short }}
          path: artifacts/ScarletNX-windows-x86_64-${{ steps.plan.outputs.short }}
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the Windows on Arm build
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-windows-aarch64.zip '))
        continue-on-error: true # its job may fail without failing the run: the notes say not built
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-windows-aarch64-${{ steps.plan.outputs.short }}
          path: artifacts/ScarletNX-windows-aarch64-${{ steps.plan.outputs.short }}
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the Android APK
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-android-universal.apk '))
        continue-on-error: ${{ steps.plan.outputs.kind == 'pr' || steps.plan.outputs.kind == 'main' }}
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-android-universal-${{ steps.plan.outputs.short }}.apk
          path: artifacts/ScarletNX-android-universal-${{ steps.plan.outputs.short }}.apk
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the macOS app
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-macos-arm64.zip '))
        continue-on-error: true # its job may fail without failing the run: the notes say not built
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-macos-arm64-${{ steps.plan.outputs.short }}.zip
          path: artifacts/ScarletNX-macos-arm64-${{ steps.plan.outputs.short }}.zip
          skip-decompress: true # a zip itself (the app, the IPA): kept as the job made it, not unpacked
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the iOS IPA
        if: >-
          steps.plan.outputs.run &&
          (steps.plan.outputs.kind != 'main' || contains(steps.plan.outputs.need, ' ScarletNX-ios-arm64.ipa '))
        continue-on-error: true # its job may fail without failing the run: the notes say not built
        uses: actions/download-artifact@v8
        with:
          name: ScarletNX-ios-arm64-${{ steps.plan.outputs.short }}.ipa
          path: artifacts/ScarletNX-ios-arm64-${{ steps.plan.outputs.short }}.ipa
          skip-decompress: true # a zip itself (the app, the IPA): kept as the job made it, not unpacked
          run-id: ${{ steps.plan.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish them
        if: steps.plan.outputs.run
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          RUN: ${{ steps.plan.outputs.run }}
          SHA: ${{ steps.plan.outputs.sha }}
          PR: ${{ steps.plan.outputs.pr }}
          TAG: ${{ steps.plan.outputs.tag }}
          DAY: ${{ steps.plan.outputs.day }}
        run: |
          python3 scripts/publish-builds.py publish --repo "$GITHUB_REPOSITORY" --to "$NIGHTLY_REPO" --kind "$KIND" \
            --run "$RUN" --sha "$SHA" ${PR:+--pr "$PR"} ${TAG:+--tag "$TAG"} ${DAY:+--day "$DAY"} --artifacts artifacts \
            --checkout .
      # Once a Build run of a pull request of this repository ends, one comment on the pull request, which each run
      # rewrites, links its builds and names the jobs that did not build (scripts/pr-builds.sh), main's script: here,
      # where the end of a Build already takes a runner, and after the publishing, whatever became of it. A fork's
      # pull request gets no comment, as its Build ran the fork's workflow, which names the builds and jobs the comment
      # would. PR empty when the run names none: the script asks which open pull request has the commit as its head
      - name: Link the builds from the pull request
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: scripts/pr-builds.sh "$GITHUB_REPOSITORY" "$PR" "$RUN" "$SHA"
