name: Feature request
description: Something ScarletNX should do that it does not
title: '[feature] '
labels: ['kind: enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Say what you want to do and what stops you. A concrete game, setting or workflow helps more than a general
        idea. Attach nothing of a game: no keys, dumps, ROMs or game files.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what ScarletNX does now that gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: The behavior you would like, a setting's name or a key, or how another emulator does it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else you tried
      description: Another setting, a command-line option, or a workaround outside ScarletNX.
  - type: checkboxes
    id: nothing
    attributes:
      label: Nothing of a game
      options:
        - label: The request attaches no key, dump, ROM or game file.
          required: true
