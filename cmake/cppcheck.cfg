<?xml version="1.0"?>
<!-- What cppcheck cannot read from our headers: snx_alloc and the calls built on it end the process when memory runs
     out (common.c), so what they return is never NULL. -->
<def format="2">
  <memory>
    <alloc init="false" buffer-size="malloc" no-fail="true">snx_alloc</alloc>
    <realloc init="false" buffer-size="malloc:2" no-fail="true">snx_realloc</realloc>
    <dealloc>free</dealloc>
  </memory>
  <memory>
    <alloc init="true" buffer-size="strdup" no-fail="true">snx_strdup</alloc>
    <alloc init="true" no-fail="true">snx_format</alloc>
    <dealloc>free</dealloc>
  </memory>
</def>
